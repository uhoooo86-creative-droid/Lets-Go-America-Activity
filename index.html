<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🇺🇸 USA Travel English Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Nunito:wght@700;800;900&family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --sky1:#5BB8E8;--sky2:#87CEEB;--sky3:#A8DDF0;
  --cream:#FFF9EE;--card:rgba(255,253,246,.94);
  --ora:#FF9500;--ora2:#FFB340;--gld:#FFD60A;--gld2:#FF9F0A;
  --red:#FF3B30;--grn:#34C759;--grn2:#30D158;
  --ink:#1C1C1E;--sub:#636366;--pale:#C7C7CC;
  --r:18px;--rL:26px;--rXL:34px;
  --sh:0 8px 0 rgba(0,0,0,.12);--shC:0 12px 28px rgba(0,0,0,.14);
}
html,body{height:100%;overflow:hidden;font-family:'Baloo 2','Jua','Nunito','Jua',sans-serif;color:var(--ink);}

/* SKY */
.sky-bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(170deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%);}
.sky-bg::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 200px 100px at 7% 10%,rgba(255,255,255,.88) 0%,transparent 70%),
    radial-gradient(ellipse 140px 75px at 19% 6%,rgba(255,255,255,.72) 0%,transparent 70%),
    radial-gradient(ellipse 220px 110px at 73% 7%,rgba(255,255,255,.82) 0%,transparent 70%),
    radial-gradient(ellipse 160px 80px at 88% 3%,rgba(255,255,255,.68) 0%,transparent 70%),
    radial-gradient(ellipse 100px 55px at 94% 13%,rgba(255,255,255,.55) 0%,transparent 70%),
    radial-gradient(ellipse 140px 70px at 3% 88%,rgba(255,255,255,.45) 0%,transparent 70%),
    radial-gradient(ellipse 90px 45px at 96% 84%,rgba(255,255,255,.4) 0%,transparent 70%);}

/* SCREENS */
.screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .25s;-webkit-overflow-scrolling:touch;}
.screen.active{opacity:1;pointer-events:auto;}
.screen-inner{min-height:100%;padding-bottom:40px;}

/* ── PLANE ── */
.plane-wrap{height:72px;position:relative;overflow:hidden;}
.plane{position:absolute;font-size:2.6rem;top:12px;left:-15%;animation:flyPlane 7s linear infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2));}
@keyframes flyPlane{0%{left:-15%;opacity:0;}8%{opacity:1;}92%{opacity:1;}100%{left:108%;opacity:0;}}
.plane::after{content:'';position:absolute;right:102%;top:50%;transform:translateY(-50%);width:80px;height:3px;background:linear-gradient(to left,rgba(255,255,255,.75),transparent);border-radius:99px;}

/* ── HOME TITLE ── */
.home-title-wrap{text-align:center;padding:0 20px 18px;}
.home-title{font-size:2.1rem;font-weight:900;line-height:1.12;color:#fff;text-shadow:0 4px 0 rgba(0,80,160,.18),0 0 32px rgba(120,200,255,.35);letter-spacing:.01em;}
.home-title em{color:var(--gld);font-style:normal;text-shadow:0 4px 0 rgba(160,90,0,.22),0 0 24px rgba(255,220,0,.38);}
.home-sub{font-size:.92rem;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:.04em;margin-top:5px;text-shadow:0 2px 5px rgba(0,0,0,.1);}

/* ── PLAYER CARD ── */
.player-card{margin:0 16px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--rXL);padding:14px 18px 14px 14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shC),0 -2px 0 rgba(255,255,255,.95) inset;border:2px solid rgba(255,255,255,.85);}
.player-avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#FFD4A3,#FFB574);border:3px solid rgba(255,200,100,.45);display:flex;align-items:center;justify-content:center;font-size:2.1rem;flex-shrink:0;box-shadow:0 4px 12px rgba(255,160,60,.28);}
.player-name{font-size:1.05rem;font-weight:900;color:var(--ink);}
.xp-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.xp-track{flex:1;height:12px;background:rgba(200,185,150,.22);border-radius:99px;overflow:hidden;border:2px solid rgba(200,160,80,.18);}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gld2),var(--gld));border-radius:99px;transition:width .6s;box-shadow:0 0 10px rgba(255,200,0,.45);}
.xp-txt{font-size:.72rem;font-weight:900;color:var(--sub);white-space:nowrap;}
.lv-badge{background:linear-gradient(135deg,var(--ora),var(--ora2));color:#fff;font-weight:900;font-size:.9rem;padding:8px 16px;border-radius:999px;white-space:nowrap;box-shadow:0 5px 0 rgba(160,70,0,.28),0 8px 18px rgba(255,140,0,.22);}

/* ── MAP ── */
.map-sec{margin:0 16px 14px;}
.map-sec-label{font-weight:900;font-size:.95rem;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:7px;text-shadow:0 2px 6px rgba(0,0,0,.16);}
.map-box{background:linear-gradient(155deg,#D8EDB0 0%,#B8D880 50%,#A0C868 100%);border-radius:var(--rXL);padding:12px;box-shadow:var(--shC),0 -3px 0 rgba(255,255,255,.55) inset,0 4px 0 rgba(100,150,40,.35);border:3px solid rgba(255,255,255,.72);position:relative;overflow:hidden;}
.map-box::before{content:'';position:absolute;top:0;left:0;right:0;height:20px;background:linear-gradient(to bottom,rgba(255,255,255,.28),transparent);pointer-events:none;}
.map-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:20px;background:linear-gradient(to top,rgba(80,120,30,.22),transparent);pointer-events:none;}
#usaMapSvg{width:100%;display:block;border-radius:var(--r);filter:drop-shadow(0 4px 10px rgba(0,0,0,.1));}

/* ── LEGEND ── */
.legend{display:flex;justify-content:center;gap:20px;margin:12px 0 10px;}
.leg{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;color:rgba(255,255,255,.94);text-shadow:0 1px 4px rgba(0,0,0,.18);}
.leg-dot{width:13px;height:13px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5);flex-shrink:0;}

/* ── CTA CONTINUE ── */
.continue-card{margin:0 16px 16px;background:linear-gradient(135deg,var(--ora),#E07400);border-radius:var(--rXL);padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 0 rgba(150,55,0,.32),var(--shC);cursor:pointer;border:none;width:100%;text-align:left;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;}
.continue-card::before{content:'';position:absolute;top:0;left:0;right:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);pointer-events:none;}
.continue-card:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(150,55,0,.32);}
.cc-emoji{font-size:2.5rem;flex-shrink:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18));}
.cc-info{flex:1;min-width:0;}
.cc-city{font-size:1.15rem;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.18);}
.cc-desc{font-size:.78rem;font-weight:700;color:rgba(255,255,255,.8);margin-top:2px;}
.cc-arr{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.38);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;font-weight:900;flex-shrink:0;}

/* ── STAGE SCREEN ── */
.stage-hud{background:linear-gradient(135deg,var(--ora),var(--ora2));padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 5px 0 rgba(150,65,0,.26),0 8px 20px rgba(255,140,0,.18);}
.hud-back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);border:2.5px solid rgba(255,255,255,.38);color:#fff;font-size:1.3rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hud-city-nm{flex:1;font-weight:900;font-size:1.05rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.14);}
.hud-xp{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 13px;font-weight:900;font-size:.8rem;color:#fff;}
.stage-hero{margin:14px;border-radius:var(--rXL);overflow:hidden;box-shadow:var(--shC);position:relative;}
.stage-hero-content{padding:26px 20px;text-align:center;position:relative;}
.stage-hero-content::before{content:'';position:absolute;top:0;left:0;right:0;height:55%;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent);pointer-events:none;}
.stage-hero-emoji{font-size:3.6rem;margin-bottom:8px;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18));}
.stage-hero-city{font-size:1.9rem;font-weight:900;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.22);}
.stage-hero-sub{font-size:.8rem;font-weight:700;color:rgba(255,255,255,.8);margin:4px 0 14px;}
.prog-row{display:flex;align-items:center;gap:10px;max-width:280px;margin:0 auto;}
.prog-track{flex:1;height:14px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;border:2px solid rgba(255,255,255,.22);}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gld),#FFF176);box-shadow:0 0 10px rgba(255,220,0,.55);transition:width .6s;}
.prog-txt{font-weight:900;font-size:.85rem;color:#fff;white-space:nowrap;}
.week-hd{margin:14px 16px 8px;}
.week-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:999px;font-weight:900;font-size:.8rem;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.14);position:relative;overflow:hidden;}
.week-pill::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.2);border-radius:999px;}

/* ── MISSION ITEMS ── */
.mission-item{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:0 16px 10px;padding:14px 16px;border-radius:var(--rXL);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.1),var(--shC);border:2px solid rgba(255,255,255,.88);position:relative;overflow:hidden;touch-action:manipulation;transition:transform .12s,box-shadow .12s;}
.mission-item::before{content:'';position:absolute;top:0;left:0;right:0;height:44%;background:linear-gradient(180deg,rgba(255,255,255,.52),transparent);pointer-events:none;border-radius:var(--rXL) var(--rXL) 0 0;}
.mission-item:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.1);}
.mission-item.cleared{background:linear-gradient(135deg,rgba(240,255,247,.92),rgba(218,250,232,.92));border-color:rgba(52,199,89,.28);}
.mission-item.current{border-color:rgba(255,149,0,.48);box-shadow:0 6px 0 rgba(255,100,0,.16),0 8px 24px rgba(255,149,0,.14);}
.mission-item.locked{opacity:.5;cursor:default;}
.mission-icon-wrap{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;box-shadow:0 4px 0 rgba(0,0,0,.12);position:relative;overflow:hidden;}
.mission-icon-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.28);border-radius:16px 16px 0 0;}
.mission-info{flex:1;min-width:0;}
.mission-title{font-size:.95rem;font-weight:900;color:var(--ink);margin-bottom:2px;}
.mission-desc{font-size:.7rem;font-weight:700;color:var(--sub);}
.rev-badge{background:linear-gradient(135deg,var(--ora),var(--ora2));color:#fff;font-size:.62rem;font-weight:900;padding:3px 8px;border-radius:999px;vertical-align:middle;}
.play-btn{width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--ora),var(--ora2));color:#fff;font-size:.95rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(150,65,0,.26);position:relative;z-index:1;}

/* ── GAME ── */
#gameTop{position:sticky;top:0;z-index:10;}
.game-hud{background:transparent;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.game-hud-title{flex:1;font-weight:900;font-size:1rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.18);}
.game-body{padding:16px;min-height:calc(100vh - 100px);}
.game-prog-dots{display:flex;gap:5px;align-items:center;}
.gpd{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .2s;}
.gpd.done{background:var(--gld);width:10px;height:10px;}
.gpd.now{background:#fff;width:10px;height:10px;box-shadow:0 0 6px rgba(255,255,255,.8);}

/* ── GAME CARDS ── */
.g-card{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:var(--rXL);padding:20px;box-shadow:0 6px 0 rgba(0,0,0,.08),var(--shC);border:2px solid rgba(255,255,255,.88);margin-bottom:12px;position:relative;overflow:hidden;}
.g-card::before{content:'';position:absolute;top:0;left:0;right:0;height:38%;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);pointer-events:none;}
.g-card-center{text-align:center;}
.g-emoji{font-size:3.4rem;margin-bottom:10px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12));}

/* FLIP */
.flip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:2px;}
.flip-card{aspect-ratio:1;perspective:600px;cursor:pointer;}
.flip-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .38s ease;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.1);}
.flip-front{background:linear-gradient(135deg,var(--ora),var(--ora2));border:2.5px solid rgba(255,255,255,.38);}
.flip-front::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.18);border-radius:var(--r) var(--r) 0 0;}
.flip-front-icon{font-size:1.5rem;position:relative;}
.flip-back{background:rgba(255,255,255,.94);border:2.5px solid rgba(255,200,100,.28);transform:rotateY(180deg);}
.flip-back.matched{background:linear-gradient(135deg,#E8FAF0,#C8F5E0);border-color:var(--grn);}
.flip-back.wrong{background:#FFF0F0;border-color:var(--red);}
.flip-back-emoji{font-size:1.7rem;margin-bottom:3px;}
.flip-back-word{font-size:.68rem;font-weight:900;color:var(--ink);text-align:center;padding:2px 4px;}

/* CHOICES */
.choice-q-txt{font-weight:900;font-size:1rem;color:var(--ink);line-height:1.45;}
.choice-blank{display:inline-block;border-bottom:3px solid var(--ora);min-width:54px;text-align:center;color:var(--ora);font-weight:900;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.choice-btn{background:rgba(255,255,255,.9);border:2.5px solid rgba(255,200,100,.2);border-radius:var(--r);padding:14px 8px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.08);width:100%;position:relative;overflow:hidden;transition:transform .1s;}
.choice-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.5);border-radius:var(--r) var(--r) 0 0;}
.choice-btn:active{transform:translateY(2px);}
.choice-btn.correct{background:linear-gradient(135deg,#E8FAF0,#D4F5E5);border-color:var(--grn);}
.choice-btn.wrong{background:#FFF0F0;border-color:var(--red);}
.choice-btn-word{font-weight:900;font-size:.98rem;color:var(--ink);position:relative;}

/* OX */
.ox-wrap{display:flex;flex-direction:column;gap:12px;}
.ox-sentence{font-weight:900;font-size:1.1rem;color:var(--ink);line-height:1.5;}
.ox-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ox-btn{padding:20px 10px;border-radius:var(--rXL);border:none;cursor:pointer;font-size:2.4rem;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 7px 0 rgba(0,0,0,.14);position:relative;overflow:hidden;transition:transform .12s;}
.ox-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.18);border-radius:var(--rXL) var(--rXL) 0 0;}
.ox-btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.14);}
.ox-btn-o{background:linear-gradient(135deg,#34C759,#30D158);}
.ox-btn-x{background:linear-gradient(135deg,#FF3B30,#FF6B60);}
.ox-lbl{font-weight:900;font-size:.85rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.18);position:relative;}

/* LISTEN */
.listen-speaker-btn{width:76px;height:76px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--ora),var(--ora2));font-size:2rem;cursor:pointer;box-shadow:0 7px 0 rgba(150,65,0,.26);position:relative;transition:transform .12s;}
.listen-speaker-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.18);border-radius:50%;}
.listen-speaker-btn:active{transform:translateY(3px);}
.listen-speaker-btn.playing{animation:sPlaying .5s ease infinite alternate;}
@keyframes sPlaying{to{transform:scale(1.08);}}
.listen-hint{font-weight:800;font-size:.85rem;color:var(--sub);margin-top:10px;}
.listen-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;}
.listen-choice{background:rgba(255,255,255,.9);border-radius:var(--rXL);border:2.5px solid rgba(255,200,100,.16);padding:14px 8px;text-align:center;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.08);position:relative;overflow:hidden;transition:transform .1s;}
.listen-choice::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.5);border-radius:var(--rXL) var(--rXL) 0 0;}
.listen-choice:active{transform:translateY(2px);}
.listen-choice.correct{background:linear-gradient(135deg,#E8FAF0,#D4F5E5);border-color:var(--grn);}
.listen-choice.wrong{background:#FFF0F0;border-color:var(--red);}
.listen-choice-emoji{font-size:2rem;display:block;margin-bottom:5px;position:relative;}
.listen-choice-word{font-weight:900;font-size:.75rem;color:var(--sub);}

/* BUILD */
.build-wrap{display:flex;flex-direction:column;gap:11px;}
.build-target{background:rgba(255,255,255,.86);border-radius:var(--rXL);padding:15px;min-height:70px;border:3px dashed rgba(255,180,80,.38);box-shadow:0 4px 16px rgba(0,0,0,.06);}
.build-slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:38px;}
.build-slot-word{background:linear-gradient(135deg,var(--ora),var(--ora2));color:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:900;font-size:.88rem;box-shadow:0 4px 0 rgba(150,65,0,.26);}
.build-tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:4px;}
.build-tile{background:rgba(255,255,255,.9);border-radius:999px;border:2.5px solid rgba(255,200,100,.22);padding:7px 15px;cursor:pointer;font-weight:900;font-size:.88rem;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .1s;}
.build-tile:active{transform:scale(.95);}
.build-tile.used{opacity:.3;cursor:default;}
.build-check-btn{padding:14px;border-radius:var(--rXL);border:none;background:linear-gradient(135deg,#34C759,#30D158);color:#fff;font-weight:900;font-size:.95rem;cursor:pointer;box-shadow:0 6px 0 rgba(0,120,40,.26);width:100%;position:relative;overflow:hidden;transition:transform .12s;}
.build-check-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.14);border-radius:var(--rXL) var(--rXL) 0 0;}
.build-check-btn:active{transform:translateY(3px);}

/* SPEECH/CHANT/MISSIONCARD */
.speech-wrap,.mission-card-wrap{display:flex;flex-direction:column;gap:12px;}
.speech-card{text-align:center;}
.speech-img,.chant-img,.mc-trophy{font-size:3.2rem;margin-bottom:10px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12));}
.eng{font-weight:900;font-size:1.25rem;color:var(--ora);letter-spacing:.02em;line-height:1.3;}
.kor{font-size:.84rem;font-weight:700;color:var(--sub);margin-top:4px;}
.native-btn{margin-top:12px;background:linear-gradient(135deg,#4FC3F7,#0288D1);border:none;border-radius:999px;padding:9px 20px;font-family:'Baloo 2','Jua',sans-serif;font-weight:900;font-size:.85rem;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(1,80,160,.22);position:relative;overflow:hidden;transition:transform .12s;}
.native-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.18);border-radius:999px;}
.native-btn:active{transform:scale(.96);}
.native-btn.playing{animation:sPlaying .5s ease infinite alternate;}
.rec-area{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 0;}
.rec-btn{width:68px;height:68px;border-radius:50%;border:none;background:linear-gradient(135deg,#FF3B30,#FF6B60);font-size:1.7rem;cursor:pointer;box-shadow:0 6px 0 rgba(150,18,18,.26);position:relative;transition:transform .12s;}
.rec-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.18);border-radius:50%;}
.rec-btn:active{transform:scale(.92);}
.rec-btn.recording{animation:recPulse 1s ease infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 6px 0 rgba(150,18,18,.26),0 0 0 0 rgba(255,60,48,.38);}50%{box-shadow:0 6px 0 rgba(150,18,18,.26),0 0 0 14px rgba(255,60,48,0);}}
.rec-lbl{font-weight:800;font-size:.8rem;color:var(--sub);text-align:center;}
.rec-playback,.rec-playback-row{display:flex;align-items:center;gap:8px;width:100%;}
.submit-btn{width:100%;padding:14px;border-radius:var(--rXL);border:none;background:linear-gradient(135deg,#34C759,#30D158);color:#fff;font-family:'Baloo 2','Jua',sans-serif;font-weight:900;font-size:.95rem;cursor:pointer;box-shadow:0 6px 0 rgba(0,120,40,.26);position:relative;overflow:hidden;transition:transform .12s;}
.submit-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.14);border-radius:var(--rXL) var(--rXL) 0 0;}
.submit-btn:active{transform:translateY(3px);}
.chant-card{text-align:left;}
.chant-lines{display:flex;flex-direction:column;gap:7px;}
.chant-line{font-weight:800;font-size:.92rem;color:var(--ink);padding:8px 12px;border-radius:var(--r);background:rgba(255,200,100,.1);}
.chant-line.hl{background:linear-gradient(135deg,rgba(255,220,120,.28),rgba(255,180,60,.18));color:var(--ora);}
.chant-listen-btns{display:flex;gap:9px;margin-bottom:10px;}
.chant-listen-btn{flex:1;padding:11px;border-radius:var(--rXL);border:none;background:linear-gradient(135deg,var(--ora2),var(--gld));color:#fff;font-family:'Baloo 2','Jua',sans-serif;font-weight:900;font-size:.85rem;cursor:pointer;box-shadow:0 5px 0 rgba(170,110,0,.26);position:relative;overflow:hidden;transition:transform .12s;}
.chant-listen-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.18);border-radius:var(--rXL) var(--rXL) 0 0;}
.chant-listen-btn:active{transform:scale(.96);}
.chant-listen-btn.playing{animation:sPlaying .5s ease infinite alternate;}
.mc-title{font-weight:900;font-size:1.05rem;color:var(--ink);text-align:center;margin-bottom:12px;}
.mc-step{display:flex;align-items:flex-start;gap:11px;background:rgba(255,200,100,.1);border-radius:var(--r);padding:11px 13px;margin-bottom:7px;}
.mc-num{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ora),var(--ora2));color:#fff;font-weight:900;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 0 rgba(150,65,0,.22);}
.mc-text{font-weight:800;font-size:.85rem;color:var(--ink);line-height:1.5;}
.speak-step-btn{background:none;border:none;font-size:.95rem;cursor:pointer;margin-left:4px;}

/* VIDEO */
.video-intro{text-align:center;}
.video-intro-img{font-size:2.8rem;margin-bottom:7px;display:block;}
.video-intro-txt{font-weight:900;font-size:.95rem;color:var(--ink);}
.video-loading{text-align:center;padding:36px 20px;}
.video-loading-emoji{font-size:2.8rem;}
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.video-thumb{background:rgba(255,255,255,.9);border-radius:var(--r);overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.08),var(--shC);cursor:pointer;border:2.5px solid transparent;transition:transform .12s;}
.video-thumb:active{transform:scale(.96);}
.video-thumb.watched{border-color:var(--grn);}
.video-thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}
.video-thumb-info{padding:8px;}
.video-thumb-title{font-weight:900;font-size:.72rem;color:var(--ink);line-height:1.3;}

/* OVERLAYS */
.fb-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .18s;}
.fb-overlay.show{opacity:1;}
.fb-bubble{background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-radius:var(--rXL);padding:24px 40px;text-align:center;box-shadow:var(--shC);border:2px solid rgba(255,255,255,.88);transform:scale(.8);transition:transform .18s;}
.fb-overlay.show .fb-bubble{transform:scale(1);}
.fb-emoji{font-size:2.8rem;}
.fb-text{font-weight:900;font-size:.95rem;color:var(--ink);margin-top:7px;}
.lvup-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.lvup-overlay.show{opacity:1;pointer-events:auto;}
.lvup-card{background:rgba(255,255,255,.96);border-radius:var(--rXL);padding:40px 28px;text-align:center;box-shadow:var(--shC);max-width:300px;border:2px solid rgba(255,220,100,.38);}
.lvup-trophy{font-size:3.8rem;margin-bottom:10px;display:block;}
.lvup-title{font-size:1.55rem;font-weight:900;color:var(--ora);}
.lvup-sub{font-size:.88rem;font-weight:700;color:var(--sub);margin-top:5px;}
.lvup-close{margin-top:18px;padding:12px 32px;border-radius:999px;background:linear-gradient(135deg,var(--ora),var(--ora2));color:#fff;border:none;font-family:'Baloo 2','Jua',sans-serif;font-size:.92rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(150,65,0,.26);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:rgba(28,28,30,.9);color:#fff;border-radius:999px;padding:10px 22px;font-weight:900;font-size:.85rem;z-index:300;transition:transform .3s ease;white-space:nowrap;box-shadow:var(--shC);backdrop-filter:blur(8px);}
.toast.show{transform:translateX(-50%) translateY(0);}
.star-rain{position:fixed;inset:0;z-index:150;pointer-events:none;}
.star-particle{position:absolute;font-size:1.7rem;animation:starFall .9s ease-out forwards;}
@keyframes starFall{0%{opacity:1;transform:translateY(-20px) rotate(0deg) scale(0);}50%{opacity:1;transform:translateY(36px) rotate(180deg) scale(1.2);}100%{opacity:0;transform:translateY(90px) rotate(360deg) scale(.4);}}
button{font-family:'Baloo 2','Jua','Nunito','Jua',sans-serif;}

/* ═══════════ 3D MAP ═══════════ */
.map-3d-wrap{position:relative;width:100%;user-select:none;}
.map-island-svg{width:100%;display:block;border-radius:16px;}

.map-pins-layer{position:absolute;inset:0;pointer-events:none;}

.mp-pin{
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:all;
  cursor:pointer;
  z-index:2;
}
.mp-icon-wrap{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));
  transition:transform .15s;
}
.mp-pin:active .mp-icon-wrap{transform:scale(.88);}

.mp-shadow{
  width:36px;height:10px;border-radius:50%;
  background:rgba(0,0,0,.25);
  filter:blur(3px);
  margin-bottom:-8px;
  transform:scaleX(1.2);
}
.mp-circle{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#8E9BB0,#6B7A90);
  box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.3);
  position:relative;transition:background .3s;
}
.mp-circle::before{
  content:'';position:absolute;top:3px;left:3px;right:3px;height:40%;
  background:rgba(255,255,255,.28);border-radius:50%;
}
.mp-emoji{font-size:1.45rem;line-height:1;position:relative;}

.mp-label{
  background:rgba(50,60,90,.75);
  color:#fff;font-family:'Baloo 2','Jua',sans-serif;
  font-size:8.5px;font-weight:900;
  padding:2px 7px;border-radius:99px;
  white-space:nowrap;letter-spacing:.3px;
  box-shadow:0 2px 0 rgba(0,0,0,.2);
  backdrop-filter:blur(4px);
}

/* Active pulse for in-progress */
.mp-active{
  animation:mpPulse 2s ease-in-out infinite;
}
@keyframes mpPulse{
  0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.3),0 0 0 0 rgba(255,149,0,.5);}
  50%{box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.3),0 0 0 10px rgba(255,149,0,0);}
}

/* Gold ring for completed */
.mp-done{
  box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.3),0 0 0 3px rgba(255,215,0,.6) !important;
}

/* ═══════════ VOICE PICKER ═══════════ */
.voice-bar{
  margin:0 16px 20px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:var(--rXL);
  padding:14px 16px;
  box-shadow:0 6px 0 rgba(0,0,0,.08),var(--shC);
  border:2px solid rgba(255,255,255,.85);
}
.voice-bar-title{
  font-size:.8rem;font-weight:900;color:var(--sub);
  letter-spacing:.05em;text-transform:uppercase;
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.voice-scroll{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.voice-scroll::-webkit-scrollbar{display:none;}
.voice-chip{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 14px;border-radius:var(--rL);
  border:2.5px solid rgba(200,190,170,.3);
  background:rgba(255,255,255,.7);
  cursor:pointer;transition:transform .12s,border-color .15s,background .15s;
  min-width:72px;
}
.voice-chip:active{transform:scale(.94);}
.voice-chip.selected{
  background:linear-gradient(135deg,var(--ora),var(--ora2));
  border-color:rgba(255,255,255,.6);
  box-shadow:0 4px 0 rgba(160,70,0,.25),0 6px 16px rgba(255,149,0,.2);
}
.voice-chip-icon{font-size:1.6rem;line-height:1;}
.voice-chip-name{
  font-size:.65rem;font-weight:900;color:var(--ink);
  white-space:nowrap;text-align:center;
}
.voice-chip.selected .voice-chip-name{color:#fff;}
.voice-chip-tag{
  font-size:.55rem;font-weight:700;
  color:var(--sub);
  background:rgba(0,0,0,.07);
  padding:1px 5px;border-radius:99px;
  white-space:nowrap;
}
.voice-chip.selected .voice-chip-tag{color:rgba(255,255,255,.8);background:rgba(255,255,255,.2);}
.voice-test-btn{
  margin-top:10px;width:100%;padding:10px;
  border-radius:var(--rL);border:none;
  background:rgba(0,0,0,.06);
  font-family:'Baloo 2','Jua',sans-serif;font-size:.82rem;font-weight:900;
  color:var(--sub);cursor:pointer;transition:background .15s;
}
.voice-test-btn:active{background:rgba(0,0,0,.1);}

.legend{gap:16px;margin:9px 0 0}.leg{font-size:.7rem}
.continue-card,.voice-bar{width:100%;margin:15px 0 0}

.voice-bar{margin-bottom:16px}
@media(max-width:700px){.city-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.city-tile{min-height:55px;padding:6px;gap:5px}.city-symbol{font-size:1.07rem}.city-no{width:26px;height:26px;font-size:.7rem;border-radius:8px}.city-en{font-size:.64rem}.city-ko{font-size:.6rem}.home-shell{padding:12px 10px}.map-box{border-radius:14px}.brand-mark{padding:6px;font-size:.6rem}.city-grid-title small{display:none}}

function getLv(xp){for(let i=XP_LEVELS.length-1;i>=0;i--)if(xp>=XP_LEVELS[i])return i+1;return 1;}
function xpPct(lv,xp){
  const lo=XP_LEVELS[Math.max(0,lv-1)]||0,hi=XP_LEVELS[Math.min(lv,XP_LEVELS.length-1)]||9999;
  return Math.max(0,Math.min(100,Math.round((xp-lo)/(hi-lo)*100)));
}

  const vv = speechSynthesis.getVoices();

function __getBestVoice(){
  __loadVoices();
  const v = __voices;
  if(!v.length) return null;
  return (
    v.find(x => /samantha/i.test(x.name)) ||
    v.find(x => /ava|allison|joelle|monica/i.test(x.name) && x.lang === 'en-US') ||
    v.find(x => /aria|jenny|guy/i.test(x.name) && x.lang === 'en-US') ||
    v.find(x => /alex/i.test(x.name)) ||
    v.find(x => x.lang === 'en-US' && x.localService) ||
    v.find(x => x.lang === 'en-US') ||
    v.find(x => x.lang.startsWith('en-')) ||
    null
  );
}

async function recTog(){
  const btn=document.getElementById('recBtn');
  const lbl=document.getElementById('recLbl');
  if(recMR&&recMR.state==='recording'){
    recMR.stop();
    if(btn){btn.classList.remove('recording');btn.textContent='🎤';}
    if(lbl)lbl.textContent='녹음 완료! 들어보고 제출해요 🎧';
    return;
  }
  try{
    if(navigator.permissions){
      try{const p=await navigator.permissions.query({name:'microphone'});if(p.state==='denied'){toast('마이크 권한을 허용해주세요!','🎤');return;}}catch(e){}
    }
    recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    recChunks=[];
    recMR=new MediaRecorder(recStream,{mimeType:MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm'});
    recMR.ondataavailable=e=>{if(e.data&&e.data.size>0)recChunks.push(e.data);};
    recMR.onstop=()=>{
      if(session.timerInterval)clearInterval(session.timerInterval);
      recStream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(recChunks,{type:'audio/webm'});
      const url=URL.createObjectURL(blob);
      const ra=document.getElementById('recAudio');if(ra)ra.src=url;
      const rp=document.getElementById('recPlay');if(rp)rp.style.display='flex';
      const rs=document.getElementById('recSubmit');if(rs){rs.disabled=false;rs.style.opacity='1';}
      beep('ok');
      const sr=document.getElementById('speechResult');
      if(sr){
        sr.style.display='block';
        const msg=document.getElementById('speechResultMsg');
        if(msg){
          msg.style.background='#F0FDF4';msg.style.color='#166534';
          msg.textContent=(session.recAttempts||0)===0?'🎉 잘했어요! 내 목소리를 들어봐요!':'💪 다시 도전! 원어민처럼 말해봐요!';
        }
      }
      const timerLbl=document.getElementById('timerLabel');
      if(timerLbl&&!timerLbl.textContent.includes('완료'))timerLbl.textContent='녹음 완료! 🎧';
    };
    recMR.start(100);
    if(btn){btn.classList.add('recording');btn.textContent='⏹';}
    if(lbl)lbl.textContent='녹음 중... 다시 누르면 멈춰요!';
  }catch(e){
    console.error('Mic error:',e);
    if(lbl)lbl.textContent='마이크를 허용해주세요!';
    toast('마이크 권한이 필요해요!','🎤');
    const rs=document.getElementById('recSubmit');
    if(rs){rs.disabled=false;rs.style.opacity='0.7';}
  }
}

function startSpeechRec(){
  session.recMaxSec=30; session.recStartTime=Date.now();
  const bar=document.getElementById('timerBar'), lbl=document.getElementById('timerLabel');
  if(bar) bar.style.width='0%';
  let elapsed=0;
  if(session.timerInterval) clearInterval(session.timerInterval);
  session.timerInterval=setInterval(()=>{
    elapsed+=0.5;
    const pct=Math.min((elapsed/30)*100,100);
    if(bar) bar.style.width=pct+'%';
    const rem=Math.max(0,30-Math.floor(elapsed));
    if(lbl) lbl.textContent=rem>0?'⏱️ 남은 시간: '+rem+'초':'⏱️ 시간 완료!';
    if(pct>=100){clearInterval(session.timerInterval);if(recMR&&recMR.state==='recording')recMR.stop();}
  },500);
  recTog();
}

function beep(t){
  try{
    const a=new(window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    if(t==='ok'){o.type='sine';o.frequency.setValueAtTime(523,a.currentTime);o.frequency.setValueAtTime(784,a.currentTime+.1);g.gain.setValueAtTime(.25,a.currentTime);}
    else if(t==='match'){[523,659,784].forEach((f,i)=>{const o2=a.createOscillator(),g2=a.createGain();o2.connect(g2);g2.connect(a.destination);o2.frequency.value=f;g2.gain.setValueAtTime(.22,a.currentTime+i*.12);g2.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.12+.3);o2.start(a.currentTime+i*.12);o2.stop(a.currentTime+i*.12+.3);});return;}
    else if(t==='wrong'){o.type='sawtooth';o.frequency.setValueAtTime(280,a.currentTime);o.frequency.setValueAtTime(160,a.currentTime+.15);g.gain.setValueAtTime(.18,a.currentTime);}
    else{o.frequency.value=660;g.gain.setValueAtTime(.18,a.currentTime);}
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.45);
    o.start();o.stop(a.currentTime+.45);
  }catch(e){}
}

/* ═══════════ MAP PINS ═══════════ */
let tipTimer=null;

function buildMapPins(){
  // Update HTML city pin elements (not SVG createElementNS)
  const layer=document.getElementById('mapPinsLayer');
  if(!layer)return;

  LESSONS.forEach((l,i)=>{
    const cv=ST.cities[i];
    const prog=cv.cleared.length+(cv.r1?1:0)+(cv.r2?1:0);
    const done=prog>=11, hasp=prog>0;

    const pin  =document.getElementById('mpp'+i);
    const circ =document.getElementById('mppc'+i);
    const lbl  =document.getElementById('mppl'+i);
    if(!pin||!circ)return;

    // Color
    const bg=done?'linear-gradient(135deg,#FFD60A,#FF9F0A)':
             hasp?'linear-gradient(135deg,#FF9500,#FF6B00)':
                  'linear-gradient(135deg,#8E9BB0,#6B7A90)';
    const border=done?'rgba(255,255,255,.9)':hasp?'rgba(255,200,100,.8)':'rgba(255,255,255,.5)';
    circ.style.background=bg;
    circ.style.borderColor=border;
    if(lbl){
      lbl.style.background=done?'rgba(255,200,0,.92)':hasp?'rgba(255,100,0,.88)':'rgba(50,60,90,.75)';
    }

    // Progress ring via box-shadow animation class
    if(done){
      circ.classList.add('mp-done');
      circ.classList.remove('mp-active');
    } else if(hasp){
      circ.classList.add('mp-active');
      circ.classList.remove('mp-done');
    } else {
      circ.classList.remove('mp-done','mp-active');
    }

    // Register click
    pin.onclick=()=>openCity(i);
    pin.addEventListener('touchend',(e)=>{e.preventDefault();e.stopPropagation();openCity(i);});
  });
}

function buildMissionList(idx,c,l){
  const wrap=document.getElementById('missionList');
  wrap.innerHTML='';

  function wkLabel(txt,col){
    const h=document.createElement('div');h.className='week-hd';
    h.innerHTML=`<span class="week-pill" style="background:${col};">${txt}</span>`;
    wrap.appendChild(h);
  }

  function mItem(mi,m,locked,cleared,isCurrent,isRev=false,revKey=''){
    const hasRetry=!isRev&&ST.cities[idx].retry[mi]&&ST.cities[idx].retry[mi].length>0&&!cleared;
    const item=document.createElement('div');
    let cls='mission-item';
    if(cleared)cls+=' cleared';
    else if(locked)cls+=' locked';
    else if(isCurrent)cls+=' current';
    item.className=cls;

    const iconBg=cleared?'linear-gradient(135deg,#2ED573,#7BED9F)':locked?'#EDE8E0':'linear-gradient(135deg,#FF8C00,#FFA726)';
    const revBadgeHtml=isRev?`<span class="rev-badge">${revKey==='r1'?'🔁 Week 2 Review':'🏆 Final Review'}</span>`:'';
    const badgeHtml=cleared?'<div style="color:#2ED573;font-size:1.3rem;">✅</div>':locked?'<div style="color:var(--pale);font-size:1.1rem;">🔒</div>':'<button class="play-btn">▶</button>';

    item.innerHTML=`
      <div class="mission-icon-wrap" style="background:${iconBg};box-shadow:0 3px 0 rgba(0,0,0,.13);">
        ${cleared?'✅':m.icon}
      </div>
      <div class="mission-info">
        <div class="mission-title">${isRev?'':('M'+(mi+1)+' · ')}${m.name} ${revBadgeHtml}</div>
        <div class="mission-desc">${m.desc||''} · +${m.xp}⚡</div>
        ${hasRetry?'<div style="font-size:.68rem;color:var(--red1);font-weight:900;margin-top:2px;">⚠️ Try again!</div>':''}
      </div>
      ${badgeHtml}`;

    if(!locked){
      const handler=function(){
        if(isRev)startReview(idx,revKey);
        else startMission(idx,mi,hasRetry);
      };
      item.addEventListener('click',handler);
      item.addEventListener('touchend',function(e){e.preventDefault();handler();});
    }
    wrap.appendChild(item);
  }

  // Week 1 (M0-2)
  wkLabel('📅 Week 1','#FF8C00');
  [0,1,2].forEach(mi=>{
    const m=l.missions[mi],cl=c.cleared.includes(mi);
    const prev=true;
    mItem(mi,m,false,cl,!cl);
  });

  // Week 2 (M3-5)
  wkLabel('📅 Week 2','#FFA726');
  [3,4,5].forEach(mi=>{
    const m=l.missions[mi],cl=c.cleared.includes(mi);
    const prev=true;
    mItem(mi,m,false,cl,!cl);
  });

  // Review 1
  wkLabel('🔁 Week 2 Review','#AB47BC');
  const r1Avail=!c.r1;
  mItem(null,{name:'Week 2 Review',icon:'🔁',desc:'Review weeks 1-2',xp:40},!r1Avail&&!c.r1,c.r1,r1Avail,true,'r1');

  // Week 3-4 (M6-8)
  wkLabel('📅 Week 3-4','#56C568');
  [6,7,8].forEach(mi=>{
    const m=l.missions[mi],cl=c.cleared.includes(mi);
    const prev=true;
    mItem(mi,m,false,cl,!cl);
  });

  // Review 2
  wkLabel('🏆 Final Review','#4ECDC4');
  const r2Avail=!c.r2;
  mItem(null,{name:'Final Review',icon:'🏆',desc:'Review everything!',xp:50},!r2Avail&&!c.r2,c.r2,r2Avail,true,'r2');
}

function startMission(cityIdx,mi,isRetry=false){
  curCity=cityIdx;curMi=mi;
  const m=LESSONS[cityIdx].missions[mi];
  session={qs:[],qi:0,wrong:[],placed:[],flipped:[],matched:0,total:0,canFlip:true,spIdx:0,isRetry,isReview:false,hintShown:false};
  setupGameHud(LESSONS[cityIdx],m);
  showScreen('gameScreen');
  renderMission();
}

function setupGameHud(l,m){
  const gt=document.getElementById('gameTop');
  if(gt)gt.style.background=l.color;
  const gh=document.getElementById('gameHudTitle');
  if(gh)gh.textContent=l.emoji+' '+m.name;
  const gx=document.getElementById('gameHudXp');
  if(gx)gx.textContent=ST.xp;
  const gp=document.getElementById('gameProgressFill');
  if(gp)gp.style.width='0%';
}

function renderMission(){
  const m=LESSONS[curCity].missions[curMi];
  const body=document.getElementById('gameBody');
  body.innerHTML='';
  body.style.animation='none';void body.offsetWidth;body.style.animation='fadeIn .35s ease';
  if(m.id==='flip')renderFlip();
  else if(m.id==='fill')renderFill();
  else if(m.id==='ox')renderOX();
  else if(m.id==='listen')renderListen();
  else if(m.id==='build')renderBuild();
  else if(m.id==='video')renderVideo();
  else if(m.id==='speech')renderSpeech();
  else if(m.id==='chant')renderChant();
  else if(m.id==='missioncard')renderMissionCard();
}

/* ── FLIP ── */
function renderFlip(){
  const m=LESSONS[curCity].missions[curMi];
  const cards=[];
  m.pairs.forEach((p,i)=>{
    cards.push({id:'w'+i,pair:i,side:'word',w:p.w,e:p.e});
    cards.push({id:'e'+i,pair:i,side:'emoji',w:p.w,e:p.e});
  });
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  session.flipCards=cards;session.matched=0;session.total=m.pairs.length;
  session.canFlip=true;session.flipped=[];

  document.getElementById('gameBody').innerHTML=`
    <div style="text-align:center;margin-bottom:8px;">
      <span style="font-family:'Baloo 2','Jua',sans-serif;font-size:.9rem;color:var(--muted);">
        🃏 짝을 찾아요! · <span id="flipCount">0</span>/${m.pairs.length} 쌍
      </span>
    </div>
    <div class="flip-grid" id="flipGrid"></div>`;

  const grid=document.getElementById('flipGrid');
  cards.forEach((c,ci)=>{
    const el=document.createElement('div');
    el.className='flip-card';el.id='fc_'+c.id;
    el.innerHTML=`<div class="flip-inner">
      <div class="flip-front"><div class="flip-front-icon">⭐</div></div>
      <div class="flip-back" id="fb_${c.id}">
        ${c.side==='emoji'
          ?`<div class="flip-back-emoji">${c.e}</div><div class="flip-back-word">${c.w}</div>`
          :`<div class="flip-back-word" style="font-size:1rem;font-family:'Baloo 2','Jua',sans-serif;color:var(--text);text-align:center;padding:4px;">${c.w}</div>`}
      </div>
    </div>`;
    el.onclick=()=>flipTap(c.id,c.pair,c.side,c.w,c.e);
    grid.appendChild(el);
  });
}

function flipTap(id,pair,side,w,e){
  if(!session.canFlip)return;
  const el=document.getElementById('fc_'+id);
  if(!el||el.classList.contains('flipped'))return;
  el.classList.add('flipped');
  beep('flip');
  speak(w,0.88);
  session.flipped.push({id,pair,side,w,e});
  if(session.flipped.length===2){
    session.canFlip=false;
    const[a,b]=session.flipped;
    if(a.pair===b.pair&&a.side!==b.side){
      // match!
      setTimeout(()=>{
        beep('match');speak(a.w,0.82);
        document.getElementById('fb_'+a.id).classList.add('matched');
        document.getElementById('fb_'+b.id).classList.add('matched');
        session.matched++;
        const fc=document.getElementById('flipCount');if(fc)fc.textContent=session.matched;
        showFb(true,'짝 맞췄어요! 🎉');rainStars();
        session.flipped=[];session.canFlip=true;
        if(session.matched===session.total)setTimeout(()=>{session.wrong=[];missionDone();},700);
      },400);
    }else{
      setTimeout(()=>{
        beep('wrong');showFb(false);
        [a,b].forEach(x=>{
          const fc=document.getElementById('fc_'+x.id);const fb=document.getElementById('fb_'+x.id);
          if(fb)fb.classList.add('wrong');
          setTimeout(()=>{fc&&fc.classList.remove('flipped');fb&&fb.classList.remove('wrong');},500);
        });
        session.flipped=[];session.canFlip=true;
      },800);
    }
  }
}

function renderBuildTiles(){
  const tg=document.getElementById('buildTiles');if(!tg)return;
  tg.innerHTML='';
  session.pool.forEach((w,wi)=>{
    const t=document.createElement('div');t.className='build-tile'+(session.placed.some(p=>p.wi===wi)?' used':'');
    t.id='bt'+wi;t.textContent=w;t.onclick=()=>addBuildTile(wi,w,t);
    tg.appendChild(t);
  });
}
function addBuildTile(wi,w,el){
  if(session.placed.some(p=>p.wi===wi))return;
  session.placed.push({wi,w});
  beep('flip');speak(w,.9);
  const sl=document.getElementById('buildSlots');
  const ph=document.getElementById('buildPh');if(ph)ph.style.display='none';
  const chip=document.createElement('div');chip.className='build-slot-word';chip.textContent=w;
  chip.onclick=()=>removeBuildTile(wi,chip,el);
  sl.appendChild(chip);
  el.classList.add('used');
  const btn=document.getElementById('buildCheckBtn');
  if(btn&&session.placed.length>=session.bAns.length){btn.disabled=false;btn.style.opacity='1';}
}
function removeBuildTile(wi,chip,el){
  session.placed=session.placed.filter(p=>p.wi!==wi);
  chip.remove();
  el.classList.remove('used');
  const btn=document.getElementById('buildCheckBtn');
  if(btn){btn.disabled=true;btn.style.opacity='.4';}
  const sl=document.getElementById('buildSlots');
  if(sl&&!sl.querySelector('.build-slot-word')){
    const ph=document.getElementById('buildPh');if(ph)ph.style.display='';
  }
}
function checkBuild(){
  const placed=session.placed.map(p=>p.w);
  const ok=JSON.stringify(placed)===JSON.stringify(session.bAns);
  const msg=document.getElementById('buildMsg');
  if(ok){
    beep('ok');showFb(true);speakNatural(session.bAns.join(' '));rainStars();
    if(msg)msg.textContent='';
    setTimeout(()=>{session.qi++;updProg();
      if(session.qi>=session.qs.length)missionDone();else{session.placed=[];renderBuildQ();}},1100);
  }else{
    beep('wrong');showFb(false);
    session.bAttempts++;
    if(!session.wrong.includes(session.qi))session.wrong.push(session.qi);
    if(msg){msg.style.color=session.bAttempts>=2?'var(--orange)':'var(--red)';
      msg.textContent=session.bAttempts>=2?`💡 힌트: "${session.bAns[0]}"로 시작해요!`:'❌ 순서가 달라요. 다시 해봐요!';}
    // clear placed
    session.placed=[];
    const sl=document.getElementById('buildSlots');
    if(sl){sl.querySelectorAll('.build-slot-word').forEach(c=>c.remove());
      const ph=document.getElementById('buildPh');if(ph)ph.style.display='';}
    renderBuildTiles();
    const btn=document.getElementById('buildCheckBtn');if(btn){btn.disabled=true;btn.style.opacity='.4';}
    setTimeout(()=>{if(msg)msg.textContent='';},2500);
  }
}

/* ── PROGRESS ── */
function updProg(pct){
  if(pct!==undefined){document.getElementById('gameProgressFill').style.width=pct+'%';return;}
  const m=LESSONS[curCity].missions[curMi];
  if(['fill','ox','listen','build'].includes(m.id)){
    const total=session.qs.length||1;
    const __pf=document.getElementById('gameProgressFill');if(__pf)__pf.style.width=Math.round((session.qi/total)*100)+'%';
  }
  // progress dots
  const dotsEl=document.getElementById('gameProgDots');
  if(dotsEl&&['fill','ox','listen','build'].includes(m.id)){
    dotsEl.innerHTML='';
    const tot=session.qs.length;
    for(let i=0;i<Math.min(tot,8);i++){
      const d=document.createElement('div');
      d.className='gpd'+(i<session.qi?' done':i===session.qi?' now':'');
      dotsEl.appendChild(d);
    }
  }
}

/* ── MISSION DONE ── */
function missionDone(){
  if(session.isReview===true){revAdvance();return;}
  const m=LESSONS[curCity].missions[curMi];
  const c=ST.cities[curCity];
  const wr=session.wrong||[];
  const fullClear=wr.length===0;

  if(fullClear){
    if(!c.cleared.includes(curMi))c.cleared.push(curMi);
    delete c.retry[curMi];
  }else{
    c.retry[curMi]=wr;
  }
  const xpG=fullClear?m.xp:Math.round(m.xp*.4);
  const oldLv=ST.lv;
  ST.xp+=xpG;ST.lv=getLv(ST.xp);save();refreshHUD();

  showResult({
    emoji:fullClear?'🏆':'💪',
    title:fullClear?'클리어! 🎉':'다시 도전해요!',
    sub:fullClear?`${m.name} 완료!\n정말 잘했어요! 👏`:`${wr.length}개 틀렸어요.\n다시 풀면 더 잘할 수 있어요!`,
    xp:xpG,lvUp:ST.lv>oldLv,fullClear,isReview:false
  });
}

    lo.classList.add('show');

}
function makeBtn(txt,bg,col,fn){
  const b=document.createElement('button');
  b.style.cssText=`padding:14px;border-radius:var(--r-lg);border:none;font-family:'Baloo 2','Jua',sans-serif;font-size:1rem;cursor:pointer;background:${bg};color:${col};box-shadow:0 4px 16px rgba(0,0,0,.1);transition:transform .15s;`;
  b.textContent=txt;b.onclick=fn;
  b.addEventListener('mousedown',()=>b.style.transform='scale(.97)');
  b.addEventListener('mouseup',()=>b.style.transform='');
  return b;
}

async function fetchVids(city,pts){
  if(CITY_VIDEO_DATA[city]){showVids(CITY_VIDEO_DATA[city]);return;}
  const topic=CITY_VIDEO_TOPICS[city]||city+' for kids educational English';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,
        messages:[{role:'user',content:'Find 4 real YouTube videos for kids ESL English class age 4-7. Topic: "'+topic+'". Return ONLY JSON array no markdown: [{"title":"...","channel":"...","videoId":"11charID","duration":"3:00","views":"1M"}]'}]})
    });
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'[]').replace(/```json|```/g,'').trim();
    let vids=[];try{vids=JSON.parse(txt);}catch(e){}
    showVids(vids.length?vids:fallback(city));
  }catch(e){showVids(fallback(city));}
}
function fallback(city){
  return CITY_VIDEO_DATA[city]||[
    {title:"Songs for Kids: "+city,channel:"Super Simple Songs",url:"https://www.youtube.com/results?search_query="+encodeURIComponent("kids ESL English song "+city)+"&sp=CAMSAhAB",duration:"3:00",views:"1M+"},
    {title:"Learn About: "+city,channel:"National Geographic Kids",url:"https://www.youtube.com/results?search_query="+encodeURIComponent("children English educational "+city)+"&sp=CAMSAhAB",duration:"4:00",views:"2M+"},
    {title:"Blippi Explores "+city,channel:"Blippi",url:"https://www.youtube.com/results?search_query="+encodeURIComponent("Blippi "+city+" kids educational English")+"&sp=CAMSAhAB",duration:"8:00",views:"5M+"},
    {title:city+" for Children",channel:"CoComelon",url:"https://www.youtube.com/results?search_query="+encodeURIComponent(city+" kids ESL song English")+"&sp=CAMSAhAB",duration:"2:00",views:"50M+"},
  ];
}

/* ── REVIEW ── */
function startReview(cityIdx,rType){
  curCity=cityIdx;curRevType=rType;
  const l=LESSONS[cityIdx];
  session={qs:[],qi:0,wrong:[],placed:[],flipped:[],matched:0,total:0,canFlip:true,spIdx:0,revStep:0,isReview:true,hintShown:false};
  setupGameHud(l,{name:rType==='r1'?'2주차 리뷰':'4주차 종합 리뷰',emoji:rType==='r1'?'🔁':'🏆'});
  showScreen('gameScreen');
  renderRevStep();
}

function renderRevStep(){
  const l=LESSONS[curCity],step=session.revStep;
  if(curRevType==='r1'){
    // r1: fill(M2) + listen(M4)
    if(step===0){session.qs=[...l.missions[1].qs];session.qi=0;fillLocked=false;renderFillQ();}
    else if(step===1){session.qs=[...l.missions[3].words];session.qi=0;listenLocked=false;renderListenQ();}
    else finishReview();
  }else{
    // r2: ox(M3) + build(M5)
    if(step===0){session.qs=[...l.missions[2].qs];session.qi=0;oxLocked=false;renderOXQ();}
    else if(step===1){session.qs=[...l.missions[4].qs.slice(0,2)];session.qi=0;session.placed=[];renderBuildQ();}
    else finishReview();
  }
}

function revAdvance(){session.revStep++;renderRevStep();}
function finishReview(){
  const xp=curRevType==='r1'?40:50;
  const c=ST.cities[curCity],oldLv=ST.lv;
  if(curRevType==='r1')c.r1=true;else c.r2=true;
  ST.xp+=xp;ST.lv=getLv(ST.xp);save();refreshHUD();
  showResult({emoji:'🔁',title:(curRevType==='r1'?'2주차':'4주차')+'리뷰 완료!',sub:'이달 학습을 잘 복습했어요! 👏',xp,lvUp:ST.lv>oldLv,isReview:true});
}




/* ══════════════════════════════════════════
   VOICE PICKER
══════════════════════════════════════════ */
let __selectedVoice = null;  // null = auto (best available)

// Voice 프리셋 정의 - 아이콘/이름/설명/필터
const VOICE_PRESETS = [
  { id:'auto',   icon:'✨', name:'Auto',     tag:'Best',     filter: null },
  { id:'female', icon:'👩', name:'Woman',    tag:'Clear',    filter: v => /female|f/i.test(v.name) || /samantha|ava|allison|aria|jenny|joelle|monica|karen|victoria|zira|hazel|fiona/i.test(v.name) },
  { id:'male',   icon:'👨', name:'Man',      tag:'Deep',     filter: v => /male|m/i.test(v.name) || /alex|guy|ryan|daniel|oliver|fred|junior|lincoln|thomas/i.test(v.name) },
  { id:'slow',   icon:'🐢', name:'Slow',     tag:'x0.65',   filter: null, rate: 0.65 },
  { id:'fast',   icon:'🚀', name:'Fast',     tag:'x1.0',    filter: null, rate: 1.0  },
];

// 사용자가 선택한 설정
let __voicePreset = { id:'auto', rate:null, filter:null };

function buildVoicePicker(){
  const scroll = document.getElementById('voiceScroll');
  if(!scroll) return;

  __loadVoices();
  const voices = __voices.filter(v => v.lang && v.lang.startsWith('en'));

  scroll.innerHTML = '';

  VOICE_PRESETS.forEach(preset => {
    const chip = document.createElement('div');
    chip.className = 'voice-chip' + (preset.id === __voicePreset.id ? ' selected' : '');
    chip.innerHTML = `
      <span class="voice-chip-icon">${preset.icon}</span>
      <span class="voice-chip-name">${preset.name}</span>
      <span class="voice-chip-tag">${preset.tag}</span>
    `;
    chip.addEventListener('click', () => selectVoicePreset(preset, chip));
    scroll.appendChild(chip);
  });

  // 실제 사용 가능한 음성들 추가 (en-US 우선)
  const shown = new Set();
  const enUS = voices.filter(v => v.lang === 'en-US');
  const enOther = voices.filter(v => v.lang !== 'en-US');

  [...enUS, ...enOther].forEach(v => {
    const shortName = v.name.replace(/ \(.*?\)/g,'').replace(/Microsoft /i,'').replace(/Apple /i,'').trim();
    if(shown.has(shortName)) return;
    shown.add(shortName);

    const isFemale = /samantha|ava|allison|aria|jenny|joelle|monica|karen|victoria|zira|hazel|fiona/i.test(v.name);
    const icon = isFemale ? '👩' : '👨';
    const isUS = v.lang === 'en-US';
    const tag = isUS ? '🇺🇸' : v.lang;

    const chip = document.createElement('div');
    chip.className = 'voice-chip' + (__voicePreset.id === 'voice_'+v.name ? ' selected' : '');
    chip.innerHTML = `
      <span class="voice-chip-icon">${icon}</span>
      <span class="voice-chip-name">${shortName.slice(0,10)}</span>
      <span class="voice-chip-tag">${tag}</span>
    `;
    chip.addEventListener('click', () => {
      __voicePreset = { id: 'voice_'+v.name, rate: null, filter: null };
      __selectedVoice = v;
      document.querySelectorAll('.voice-chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      testVoice();
    });
    scroll.appendChild(chip);
  });
}

function selectVoicePreset(preset, clickedChip){
  __voicePreset = { id: preset.id, rate: preset.rate || null, filter: preset.filter || null };
  __selectedVoice = null;  // preset → auto-select by filter

  document.querySelectorAll('.voice-chip').forEach(c => c.classList.remove('selected'));
  clickedChip.classList.add('selected');

  testVoice();
}

function testVoice(){
  const btn = document.getElementById('voiceTestBtn');
  if(btn){ btn.textContent = '🔊 Playing...'; }
  speakWithPreset('Hello! I love New York! The taxi is yellow!', 0.82, 1.0).then(() => {
    if(btn){ btn.textContent = '🔊 Test: "Hello! I love New York!"'; }
  });
}

// preset을 반영한 speak
function speakWithPreset(text, rate=0.82, pitch=1.0){
  return new Promise(res => {
    if(!window.speechSynthesis){ res(); return; }

    text = String(text).replace(/USA/g,'U S A').replace(/\.$/g,'').trim();
    if(!text){ res(); return; }

    const u = new SpeechSynthesisUtterance(text);
    u.lang   = 'en-US';
    u.rate   = __voicePreset.rate || rate;
    u.pitch  = pitch;
    u.volume = 1.0;

    // 음성 결정
    if(__selectedVoice){
      u.voice = __selectedVoice;
    } else if(__voicePreset.filter){
      __loadVoices();
      const filtered = __voices.filter(v => v.lang.startsWith('en') && __voicePreset.filter(v));
      if(filtered.length) u.voice = filtered[0];
    } else {
      const best = __getBestVoice();
      if(best) u.voice = best;
    }

    u.onend = res; u.onerror = res;
    if(speechSynthesis.paused) speechSynthesis.resume();
    speechSynthesis.cancel();
    speechSynthesis.speak(u);

    setTimeout(() => { if(speechSynthesis.paused) speechSynthesis.resume(); }, 200);
  });
}

// 기존 speak → preset 반영
function speak(text, rate=0.82, pitch=1.0){
  return speakWithPreset(text, rate, pitch);
}
function speakNatural(text){ return speak(text, 0.75, 1.0); }
function speakChant(text){   return speak(text, 0.82, 1.05); }
function speakWord(text){    return speak(text, 0.70, 1.0); }
