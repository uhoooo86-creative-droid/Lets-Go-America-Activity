<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🇺🇸 미국 여행 영어놀이</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#6EC6F5;
  --cloud:#FFFFFF;
  --sun:#FFD93D;
  --grass:#7BC67E;
  --orange:#FF6B35;
  --peach:#FFB347;
  --rose:#FF6B8A;
  --mint:#4ECDC4;
  --lavender:#B39DDB;
  --cream:#FFF8F0;
  --text:#3D2B1F;
  --muted:#9B8B7A;
  --green:#56C568;
  --red:#FF5252;
  --gold:#FFD93D;
  --white:#FFFFFF;
  --card-shadow:0 8px 32px rgba(61,43,31,.13);
  --r-xl:28px;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--sky);font-family:'Nunito',sans-serif;}

/* ===== SCREENS ===== */
.screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .3s;}
.screen.active{opacity:1;pointer-events:all;}
.screen-inner{min-height:100%;padding-bottom:40px;}

/* ===== SKY BG ===== */
.sky-bg{
  position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,#87CEEB 0%,#B0E2FF 40%,#E8F8FF 70%,#F5FFF8 100%);
  overflow:hidden;pointer-events:none;
}
.cloud-float{position:absolute;border-radius:50px;background:rgba(255,255,255,.8);}
.cloud-float::before,.cloud-float::after{content:'';position:absolute;background:rgba(255,255,255,.8);border-radius:50%;}

/* ===== HOME ===== */
.home-header{
  text-align:center;padding:24px 20px 12px;
  position:relative;
}
.home-title{
  font-family:'Fredoka One',cursive;
  font-size:2.2rem;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.15),0 6px 20px rgba(0,0,0,.1);
  letter-spacing:1px;line-height:1.2;margin-bottom:4px;
}
.home-title span{color:var(--sun);}
.home-sub{font-size:.88rem;color:rgba(255,255,255,.9);font-weight:800;}

/* player card */
.player-bubble{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.92);
  border-radius:999px;padding:10px 20px 10px 10px;
  margin:12px 20px;box-shadow:var(--card-shadow);
  border:3px solid rgba(255,255,255,.9);
}
.player-avatar{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--peach),var(--rose));
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;flex-shrink:0;
  box-shadow:0 4px 12px rgba(255,107,53,.3);
}
.player-name{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--text);}
.player-xp-row{display:flex;align-items:center;gap:8px;margin-top:3px;}
.xp-bar-mini{flex:1;height:8px;background:#EDE9E3;border-radius:99px;overflow:hidden;}
.xp-fill-mini{height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.lv-chip{
  background:linear-gradient(135deg,var(--orange),var(--peach));
  color:#fff;font-family:'Fredoka One',cursive;font-size:.8rem;
  padding:3px 10px;border-radius:99px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(255,107,53,.4);
}

/* USA Map container */
.map-section{padding:8px 16px 0;}
.map-label{
  font-family:'Fredoka One',cursive;font-size:1.2rem;
  color:#fff;text-align:center;margin-bottom:8px;
  text-shadow:0 2px 8px rgba(0,0,0,.15);
}
.map-wrap{
  position:relative;background:rgba(255,255,255,.2);
  border-radius:var(--r-xl);overflow:visible;
  backdrop-filter:blur(4px);
  border:3px solid rgba(255,255,255,.5);
  padding:8px;
}
.map-wrap svg{width:100%;display:block;border-radius:var(--r-lg);overflow:visible;}

/* city tooltip */
.city-tip{
  display:none;position:absolute;z-index:20;
  background:#fff;border-radius:18px;padding:8px 14px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  pointer-events:none;transform:translateX(-50%);
  border:3px solid var(--orange);min-width:120px;
}
.city-tip-emoji{font-size:1.6rem;text-align:center;}
.city-tip-name{font-family:'Fredoka One',cursive;font-size:.9rem;color:var(--text);text-align:center;}
.city-tip-prog{font-size:.68rem;color:var(--muted);text-align:center;margin-top:2px;}
.city-tip-go{font-size:.68rem;color:var(--orange);text-align:center;font-weight:900;margin-top:3px;}

/* map legend */
.map-legend{
  display:flex;gap:12px;justify-content:center;
  margin:8px 0 4px;flex-wrap:wrap;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:rgba(255,255,255,.9);font-weight:800;}
.legend-dot{width:11px;height:11px;border-radius:50%;}

/* continue banner */
.continue-wrap{padding:12px 16px 0;}
.continue-card{
  background:linear-gradient(135deg,var(--orange),var(--peach));
  border-radius:var(--r-xl);padding:16px 20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 8px 24px rgba(255,107,53,.4);
  cursor:pointer;transition:transform .15s;
  border:3px solid rgba(255,255,255,.3);
}
.continue-card:active{transform:scale(.97);}
.continue-emoji{font-size:2.4rem;}
.continue-info h3{font-family:'Fredoka One',cursive;font-size:1.1rem;color:#fff;margin-bottom:2px;}
.continue-info p{font-size:.78rem;color:rgba(255,255,255,.9);font-weight:800;}
.continue-arrow{font-size:2rem;color:rgba(255,255,255,.7);margin-left:auto;}

/* ===== STAGE SCREEN ===== */
.stage-hud{
  background:linear-gradient(135deg,var(--orange),var(--peach));
  padding:14px 16px 12px;
  display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:10;
  border-bottom:3px solid rgba(255,255,255,.3);
}
.hud-back{
  width:44px;height:44px;border-radius:50%;border:none;
  background:rgba(255,255,255,.3);color:#fff;font-size:1.4rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;flex-shrink:0;
}
.hud-city-name{font-family:'Fredoka One',cursive;font-size:1.3rem;color:#fff;flex:1;text-shadow:0 2px 6px rgba(0,0,0,.1);}
.hud-xp-chip{
  background:rgba(255,255,255,.3);border-radius:99px;
  padding:5px 12px;display:flex;align-items:center;gap:4px;
  color:#fff;font-weight:900;font-size:.8rem;
}

/* stage hero banner */
.stage-hero{
  margin:16px;border-radius:var(--r-xl);overflow:hidden;
  position:relative;padding:24px 20px 20px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  box-shadow:var(--card-shadow);
}
.stage-hero-bg{position:absolute;inset:0;z-index:0;}
.stage-hero-content{position:relative;z-index:1;}
.stage-hero-emoji{font-size:4rem;margin-bottom:6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));}
.stage-hero-city{font-family:'Fredoka One',cursive;font-size:1.8rem;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.12);}
.stage-hero-theme{font-size:.85rem;color:rgba(255,255,255,.9);font-weight:800;margin-top:2px;}
.stage-progress-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
.stage-prog-bar{flex:1;height:10px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;}
.stage-prog-fill{height:100%;background:#fff;border-radius:99px;transition:width .6s;}
.stage-prog-txt{color:rgba(255,255,255,.9);font-weight:900;font-size:.78rem;}

/* mission list */
.mission-list{padding:0 16px 24px;}
.mission-week{font-family:'Fredoka One',cursive;font-size:.95rem;color:var(--muted);margin:14px 0 8px 4px;}
.mission-item{
  display:flex;align-items:center;gap:14px;
  background:#fff;border-radius:var(--r-lg);padding:14px 16px;
  margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,.07);
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  border:2.5px solid transparent;position:relative;overflow:hidden;
}
.mission-item:active{transform:scale(.98);}
.mission-item.cleared{border-color:var(--green);background:#F0FDF4;}
.mission-item.locked{opacity:.55;cursor:not-allowed;}
.mission-item.current{border-color:var(--orange);box-shadow:0 4px 20px rgba(255,107,53,.2);}
.mission-item-shine{
  position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
  transform:translateX(-100%);
}
.mission-item.current .mission-item-shine{animation:shine 2.5s infinite;}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(200%)}}
.mission-icon-wrap{
  width:52px;height:52px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;flex-shrink:0;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}
.mission-info{flex:1;min-width:0;}
.mission-title{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--text);}
.mission-desc{font-size:.73rem;color:var(--muted);margin-top:2px;line-height:1.4;}
.mission-badge{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;flex-shrink:0;
}
.mission-badge.cleared{background:#D1FAE5;}
.mission-badge.locked{background:#F3F4F6;}
.mission-badge.current{background:linear-gradient(135deg,var(--orange),var(--peach));box-shadow:0 3px 10px rgba(255,107,53,.4);}
.mission-badge.current::after{content:'▶';font-size:.7rem;color:#fff;}

/* ===== GAME SCREEN ===== */
.game-hud{background:transparent;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.game-hud-title{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--text);flex:1;}
.game-prog-dots{display:flex;gap:5px;align-items:center;}
.gpd{width:10px;height:10px;border-radius:50%;background:#EDE9E3;transition:all .3s;}
.gpd.done{background:var(--green);}
.gpd.now{background:var(--orange);transform:scale(1.3);}

.game-body{padding:16px;}

/* ===== MISSION TYPE CARDS ===== */
/* Flip card */
.flip-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:380px;margin:0 auto;
}
.flip-card{
  aspect-ratio:1;border-radius:var(--r-lg);cursor:pointer;
  perspective:600px;
}
.flip-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);
}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-front,.flip-back{
  position:absolute;inset:0;border-radius:var(--r-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.flip-front{
  background:linear-gradient(135deg,var(--sky),#5BB8E8);
  box-shadow:0 6px 20px rgba(110,198,245,.4);
  border:3px solid rgba(255,255,255,.6);
}
.flip-front-emoji{font-size:2rem;}
.flip-back{
  transform:rotateY(180deg);
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.1);
  border:3px solid #EDE9E3;
  flex-direction:column;gap:4px;
}
.flip-back-emoji{font-size:2.6rem;}
.flip-back-word{font-family:'Fredoka One',cursive;font-size:.82rem;color:var(--text);}
.flip-card.matched .flip-back{border-color:var(--green);background:#F0FDF4;}
.flip-card.wrong .flip-back{border-color:var(--red);background:#FFF5F5;animation:card-shake .3s;}
@keyframes card-shake{0%,100%{transform:rotateY(180deg) translateX(0)}40%{transform:rotateY(180deg) translateX(-6px)}70%{transform:rotateY(180deg) translateX(6px)}}

/* Fill / choice buttons */
.choice-question{
  background:#fff;border-radius:var(--r-xl);padding:20px;
  box-shadow:var(--card-shadow);margin-bottom:16px;text-align:center;
}
.choice-img{font-size:5rem;margin-bottom:8px;line-height:1;}
.choice-question-txt{font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--text);}
.choice-blank{
  display:inline-block;min-width:80px;border-bottom:4px solid var(--orange);
  color:var(--orange);font-family:'Fredoka One',cursive;
  padding:0 8px;letter-spacing:2px;
}
.choice-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  max-width:360px;margin:0 auto;
}
.choice-btn{
  background:#fff;border:3px solid #EDE9E3;border-radius:var(--r-lg);
  padding:14px 10px;cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
}
.choice-btn:active{transform:scale(.96);}
.choice-btn-emoji{font-size:2.4rem;}
.choice-btn-word{font-family:'Fredoka One',cursive;font-size:.9rem;color:var(--text);}
.choice-btn.correct{border-color:var(--green);background:#F0FDF4;animation:btn-pop .3s;}
.choice-btn.wrong{border-color:var(--red);background:#FFF5F5;animation:card-shake .3s;}
@keyframes btn-pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* OX */
.ox-wrap{max-width:380px;margin:0 auto;}
.ox-question-card{
  background:#fff;border-radius:var(--r-xl);padding:24px 20px;
  text-align:center;box-shadow:var(--card-shadow);margin-bottom:20px;
}
.ox-img{font-size:5.5rem;margin-bottom:10px;}
.ox-sentence{font-family:'Fredoka One',cursive;font-size:1.35rem;color:var(--text);line-height:1.4;}
.ox-sentence .hl{color:var(--orange);}
.ox-buttons{display:flex;gap:14px;}
.ox-btn{
  flex:1;border:none;border-radius:var(--r-xl);padding:22px 10px;
  font-size:3rem;cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
  font-family:'Fredoka One',cursive;
}
.ox-btn-o{background:linear-gradient(135deg,#56C568,#34D058);color:#fff;}
.ox-btn-x{background:linear-gradient(135deg,#FF5252,#FF1744);color:#fff;}
.ox-btn:active{transform:scale(.94);}
.ox-lbl{font-size:1rem;}

/* Listen */
.listen-card{
  background:#fff;border-radius:var(--r-xl);padding:24px;
  text-align:center;box-shadow:var(--card-shadow);margin-bottom:16px;
}
.listen-speaker-btn{
  width:90px;height:90px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--mint),#2DC7BC);
  font-size:2.8rem;cursor:pointer;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(78,205,196,.45);
  transition:all .2s;
}
.listen-speaker-btn:active{transform:scale(.94);}
.listen-speaker-btn.playing{animation:speaker-bounce .5s infinite alternate;}
@keyframes speaker-bounce{0%{transform:scale(1)}100%{transform:scale(1.08)}}
.listen-hint{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--muted);margin-bottom:16px;}
.listen-choices{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  max-width:360px;margin:0 auto;
}
.listen-choice{
  background:#fff;border:3px solid #EDE9E3;border-radius:var(--r-lg);
  padding:16px 10px;cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
}
.listen-choice:active{transform:scale(.96);}
.listen-choice-emoji{font-size:2.8rem;}
.listen-choice-word{font-family:'Fredoka One',cursive;font-size:.85rem;color:var(--text);}
.listen-choice.correct{border-color:var(--green);background:#F0FDF4;}
.listen-choice.wrong{border-color:var(--red);background:#FFF5F5;}

/* Build sentence */
.build-wrap{max-width:400px;margin:0 auto;}
.build-target{
  background:#fff;border-radius:var(--r-xl);padding:20px;
  text-align:center;box-shadow:var(--card-shadow);margin-bottom:14px;
}
.build-target-img{font-size:4.5rem;margin-bottom:8px;}
.build-target-hint{font-family:'Fredoka One',cursive;font-size:.9rem;color:var(--muted);}
.build-slots{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  min-height:54px;padding:10px 14px;
  background:rgba(255,255,255,.7);border-radius:var(--r-lg);
  border:3px dashed var(--orange);margin-bottom:12px;align-items:center;
}
.build-slot-word{
  background:var(--orange);color:#fff;
  font-family:'Fredoka One',cursive;font-size:.95rem;
  padding:8px 14px;border-radius:99px;cursor:pointer;
  transition:all .18s;box-shadow:0 3px 10px rgba(255,107,53,.3);
}
.build-slot-word:active{transform:scale(.93);}
.build-tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 0;}
.build-tile{
  background:#fff;border:3px solid #EDE9E3;
  font-family:'Fredoka One',cursive;font-size:.95rem;
  color:var(--text);padding:10px 16px;border-radius:99px;cursor:pointer;
  transition:all .18s;box-shadow:0 3px 10px rgba(0,0,0,.06);
}
.build-tile:active{transform:scale(.93);}
.build-tile.used{opacity:.35;cursor:not-allowed;}
.build-check-btn{
  width:100%;padding:16px;border-radius:var(--r-lg);border:none;
  background:linear-gradient(135deg,var(--mint),#2DC7BC);
  font-family:'Fredoka One',cursive;font-size:1.1rem;color:#fff;
  cursor:pointer;margin-top:8px;
  box-shadow:0 5px 18px rgba(78,205,196,.4);
  transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.build-check-btn:active{transform:scale(.97);}

/* Speech / recording */
.speech-wrap{max-width:400px;margin:0 auto;}
.speech-card{
  background:#fff;border-radius:var(--r-xl);padding:20px;
  text-align:center;box-shadow:var(--card-shadow);margin-bottom:14px;
}
.speech-img{font-size:4rem;margin-bottom:6px;}
.speech-text{
  font-family:'Fredoka One',cursive;font-size:1.2rem;color:var(--text);
  line-height:1.5;background:#FFF8F0;border-radius:var(--r-md);
  padding:10px 14px;margin-bottom:10px;
}
.speech-text .eng{color:var(--orange);}
.speech-text .kor{font-size:.8rem;color:var(--muted);}
.native-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#87CEEB,#5BB8E8);
  color:#fff;font-family:'Fredoka One',cursive;font-size:.9rem;
  padding:10px 22px;border-radius:99px;border:none;cursor:pointer;
  box-shadow:0 4px 14px rgba(91,184,232,.4);transition:all .2s;
}
.native-btn:active{transform:scale(.96);}
.native-btn.playing{animation:speaker-bounce .5s infinite alternate;}
.rec-area{text-align:center;margin-top:12px;}
.rec-btn{
  width:88px;height:88px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--rose),#FF3D6B);
  font-size:2.5rem;cursor:pointer;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(255,107,138,.4);transition:all .2s;
}
.rec-btn.recording{
  background:linear-gradient(135deg,var(--red),#B71C1C);
  animation:rec-pulse .7s infinite alternate;
}
@keyframes rec-pulse{0%{transform:scale(1);box-shadow:0 6px 24px rgba(255,82,82,.4)}100%{transform:scale(1.08);box-shadow:0 8px 32px rgba(255,82,82,.7)}}
.rec-lbl{font-family:'Fredoka One',cursive;font-size:.85rem;color:var(--muted);}
.rec-playback{
  margin:10px 0 0;background:#F5F0EA;border-radius:var(--r-md);
  padding:10px;display:flex;align-items:center;gap:8px;
}
.rec-playback audio{flex:1;height:36px;}
.submit-btn{
  width:100%;padding:16px;border-radius:var(--r-lg);border:none;
  background:linear-gradient(135deg,var(--green),#34D058);
  font-family:'Fredoka One',cursive;font-size:1.1rem;color:#fff;
  cursor:pointer;margin-top:12px;
  box-shadow:0 5px 18px rgba(86,197,104,.4);transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;}
.submit-btn:not(:disabled):active{transform:scale(.97);}

/* Video mission */
.video-intro{
  background:#fff;border-radius:var(--r-xl);padding:20px;
  text-align:center;box-shadow:var(--card-shadow);margin-bottom:14px;
}
.video-intro-img{font-size:4rem;margin-bottom:8px;}
.video-intro-txt{font-family:'Fredoka One',cursive;font-size:1.05rem;color:var(--text);}
.video-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  max-width:400px;margin:0 auto;
}
.video-thumb{
  background:#fff;border-radius:var(--r-lg);overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.1);cursor:pointer;
  transition:transform .2s;border:2.5px solid #EDE9E3;
}
.video-thumb:active{transform:scale(.96);}
.video-thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}
.video-thumb-info{padding:8px 10px;}
.video-thumb-title{font-family:'Fredoka One',cursive;font-size:.78rem;color:var(--text);line-height:1.3;}
.video-thumb.watched{border-color:var(--green);}
.video-loading{text-align:center;padding:32px;}
.video-loading-emoji{font-size:3rem;animation:spin-slow 2s linear infinite;}
@keyframes spin-slow{to{transform:rotate(360deg)}}

/* Chant */
.chant-card{
  background:linear-gradient(135deg,#F5F0FF,#EDE0FF);
  border:3px solid #C4B5FD;border-radius:var(--r-xl);
  padding:20px;margin-bottom:14px;text-align:center;
}
.chant-img{font-size:4rem;margin-bottom:10px;}
.chant-lines{margin-bottom:12px;}
.chant-line{font-family:'Fredoka One',cursive;font-size:1.1rem;color:#4C1D95;line-height:2.2;}
.chant-line .hl{color:var(--orange);}
.chant-listen-btns{display:flex;gap:10px;justify-content:center;margin-bottom:12px;}
.chant-listen-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:#fff;border:2.5px solid #C4B5FD;
  color:#5B21B6;font-family:'Fredoka One',cursive;font-size:.85rem;
  padding:9px 18px;border-radius:99px;cursor:pointer;transition:all .2s;
}
.chant-listen-btn:active{background:#EDE0FF;}
.chant-listen-btn.playing{background:#EDE0FF;animation:speaker-bounce .5s infinite alternate;}

/* Mission card */
.mission-card-wrap{max-width:400px;margin:0 auto;}
.mission-card-visual{
  background:linear-gradient(135deg,#FFFBEB,#FEF3C7);
  border:3px solid var(--gold);border-radius:var(--r-xl);
  padding:22px;margin-bottom:14px;text-align:center;
}
.mc-trophy{font-size:3.5rem;margin-bottom:8px;}
.mc-title{font-family:'Fredoka One',cursive;font-size:1.2rem;color:var(--text);margin-bottom:12px;}
.mc-step{
  display:flex;align-items:flex-start;gap:10px;
  background:rgba(255,255,255,.7);border-radius:var(--r-md);
  padding:10px 12px;margin-bottom:8px;text-align:left;
}
.mc-num{
  width:26px;height:26px;border-radius:50%;
  background:var(--orange);color:#fff;
  font-family:'Fredoka One',cursive;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.mc-text{font-size:.83rem;line-height:1.55;font-weight:700;color:var(--text);}
.mc-text strong{color:var(--orange);}

/* ===== FEEDBACK OVERLAY ===== */
.fb-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .2s;
}
.fb-overlay.show{opacity:1;}
.fb-bubble{
  background:#fff;border-radius:var(--r-xl);
  padding:28px 36px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
  transform:scale(.8);transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.fb-overlay.show .fb-bubble{transform:scale(1);}
.fb-emoji{font-size:4rem;margin-bottom:8px;}
.fb-text{font-family:'Fredoka One',cursive;font-size:1.4rem;color:var(--text);}

/* ===== LEVEL UP OVERLAY ===== */
.lvup-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
}
.lvup-overlay.show{display:flex;}
.lvup-card{
  background:#fff;border-radius:var(--r-xl);padding:36px 32px;
  text-align:center;max-width:320px;width:90%;
  animation:lvup-pop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes lvup-pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.lvup-emoji{font-size:5rem;margin-bottom:10px;}
.lvup-title{font-family:'Fredoka One',cursive;font-size:1.8rem;color:var(--orange);margin-bottom:6px;}
.lvup-sub{font-size:.9rem;color:var(--muted);font-weight:700;margin-bottom:20px;}
.lvup-btn{
  background:linear-gradient(135deg,var(--orange),var(--peach));
  color:#fff;font-family:'Fredoka One',cursive;font-size:1.1rem;
  border:none;border-radius:var(--r-lg);padding:14px 32px;cursor:pointer;
  box-shadow:0 5px 18px rgba(255,107,53,.4);
}

/* ===== TOAST ===== */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:#3D2B1F;color:#fff;border-radius:99px;
  padding:10px 22px;font-family:'Fredoka One',cursive;font-size:.95rem;
  z-index:300;transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.3);pointer-events:none;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ===== STARS RAIN ===== */
.star-rain{position:fixed;inset:0;z-index:150;pointer-events:none;}
.star-particle{
  position:absolute;font-size:1.5rem;
  animation:star-fall 1.2s ease-in forwards;
}
@keyframes star-fall{
  0%{transform:translateY(-20px) scale(0);opacity:1;}
  60%{opacity:1;}
  100%{transform:translateY(100vh) scale(.3) rotate(180deg);opacity:0;}
}

/* ===== REVIEW badge ===== */
.rev-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--gold),var(--peach));
  color:#fff;font-family:'Fredoka One',cursive;font-size:.72rem;
  padding:3px 10px;border-radius:99px;
}

function getLv(xp){for(let i=XP_LEVELS.length-1;i>=0;i--)if(xp>=XP_LEVELS[i])return i+1;return 1;}
function xpPct(lv,xp){
  const lo=XP_LEVELS[Math.max(0,lv-1)]||0,hi=XP_LEVELS[Math.min(lv,XP_LEVELS.length-1)]||9999;
  return Math.max(0,Math.min(100,Math.round((xp-lo)/(hi-lo)*100)));
}

/* ═══════════ SPEECH ═══════════ */
function speak(text,rate=0.82,pitch=1.12){
  return new Promise(res=>{
    if(!window.speechSynthesis){res();return;}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    // Clean text for better TTS pronunciation
  text=text.replace(/\.(?=\s|$)/g,' ').replace(/[!?]/g,' ').replace(/,/g,' ').trim();
  u.rate=rate;u.pitch=pitch;u.volume=1;u.lang='en-US';
    const vv=speechSynthesis.getVoices();
    const pref=vv.find(v=>v.lang==='en-US'&&/samantha|karen|zira|victoria|female/i.test(v.name))
              ||vv.find(v=>v.lang.startsWith('en-US'))
              ||vv.find(v=>v.lang.startsWith('en'));
    if(pref)u.voice=pref;
    u.onend=res;u.onerror=res;
    speechSynthesis.speak(u);
  });
}
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}

/* ═══════════ BEEP ═══════════ */
function beep(t){
  try{
    const a=new(window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    if(t==='ok'){o.type='sine';o.frequency.setValueAtTime(523,a.currentTime);o.frequency.setValueAtTime(784,a.currentTime+.1);g.gain.setValueAtTime(.25,a.currentTime);}
    else if(t==='match'){[523,659,784].forEach((f,i)=>{const o2=a.createOscillator(),g2=a.createGain();o2.connect(g2);g2.connect(a.destination);o2.frequency.value=f;g2.gain.setValueAtTime(.22,a.currentTime+i*.12);g2.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.12+.3);o2.start(a.currentTime+i*.12);o2.stop(a.currentTime+i*.12+.3);});return;}
    else if(t==='wrong'){o.type='sawtooth';o.frequency.setValueAtTime(280,a.currentTime);o.frequency.setValueAtTime(160,a.currentTime+.15);g.gain.setValueAtTime(.18,a.currentTime);}
    else{o.frequency.value=660;g.gain.setValueAtTime(.18,a.currentTime);}
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.45);
    o.start();o.stop(a.currentTime+.45);
  }catch(e){}
}

let tipTimer=null;
function buildMapPins(){
  const g=document.getElementById('cityPinsGroup');
  if(!g)return;
  g.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  LESSONS.forEach((l,i)=>{
    const cv=ST.cities[i];
    const prog=cv.cleared.length+(cv.r1?1:0)+(cv.r2?1:0);
    const done=prog>=11, hasp=prog>0;
    const coord=CITY_COORDS[i]; if(!coord)return;
    const {x,y}=coord;
    const col=done?'#56C568':hasp?'#FF6B35':'#B0BEC5';
    const bg=done?'#E8F5E9':hasp?'#FFF3E0':'#ECEFF1';
    const r=15, circ=2*Math.PI*r;
    const dash=circ*(prog/11), gap=circ-dash;
    const grp=document.createElementNS(ns,'g');
    grp.setAttribute('class','city-pin');
    grp.setAttribute('transform',`translate(${x},${y})`);
    grp.style.cursor='pointer';
    if(hasp&&!done){
      const gl=document.createElementNS(ns,'circle');
      gl.setAttribute('cx','0');gl.setAttribute('cy','0');gl.setAttribute('r','20');
      gl.setAttribute('fill',col);gl.setAttribute('opacity','0.25');
      gl.style.pointerEvents='none'; grp.appendChild(gl);
    }
    const bgc=document.createElementNS(ns,'circle');
    bgc.setAttribute('cx','0');bgc.setAttribute('cy','0');bgc.setAttribute('r',String(r+3));
    bgc.setAttribute('fill',bg);bgc.setAttribute('stroke',col);bgc.setAttribute('stroke-width','2.5');
    bgc.style.pointerEvents='none'; grp.appendChild(bgc);
    const arc=document.createElementNS(ns,'circle');
    arc.setAttribute('cx','0');arc.setAttribute('cy','0');arc.setAttribute('r',String(r));
    arc.setAttribute('fill','none');arc.setAttribute('stroke',col);arc.setAttribute('stroke-width','3.5');
    arc.setAttribute('stroke-dasharray',`${dash} ${gap}`);arc.setAttribute('stroke-linecap','round');
    arc.setAttribute('transform','rotate(-90)');
    arc.style.pointerEvents='none'; grp.appendChild(arc);
    const inn=document.createElementNS(ns,'circle');
    inn.setAttribute('cx','0');inn.setAttribute('cy','0');inn.setAttribute('r',String(r-4));
    inn.setAttribute('fill','#fffdf7');inn.style.pointerEvents='none'; grp.appendChild(inn);
    const et=document.createElementNS(ns,'text');
    et.setAttribute('x','0');et.setAttribute('y','5');
    et.setAttribute('text-anchor','middle');et.setAttribute('font-size','13');
    et.style.pointerEvents='none'; et.textContent=done?'✅':l.emoji;
    grp.appendChild(et);
    const lb=document.createElementNS(ns,'rect');
    lb.setAttribute('x','-19');lb.setAttribute('y',String(r+4));lb.setAttribute('width','38');lb.setAttribute('height','13');
    lb.setAttribute('rx','6');lb.setAttribute('fill',col);
    lb.style.pointerEvents='none'; grp.appendChild(lb);
    const lt=document.createElementNS(ns,'text');
    lt.setAttribute('x','0');lt.setAttribute('y',String(r+12));
    lt.setAttribute('text-anchor','middle');lt.setAttribute('font-size','7');
    lt.setAttribute('fill','#fff');lt.setAttribute('font-family','Fredoka One,cursive');
    lt.style.pointerEvents='none'; lt.textContent=l.city.split(' ')[0];
    grp.appendChild(lt);
    const hit=document.createElementNS(ns,'rect');
    hit.setAttribute('x','-22');hit.setAttribute('y','-22');
    hit.setAttribute('width','44');hit.setAttribute('height','56');
    hit.setAttribute('fill','transparent');
    grp.appendChild(hit);
    grp.addEventListener('click',()=>openCity(i));
    grp.addEventListener('touchend',(e)=>{e.preventDefault();e.stopPropagation();openCity(i);});
    grp.addEventListener('mouseenter',()=>pinHover(null,i));
    grp.addEventListener('mouseleave',()=>pinOut());
    g.appendChild(grp);
  });
}

function buildMissionList(idx,c,l){
  const wrap=document.getElementById('missionList');
  wrap.innerHTML='';

  function wkLabel(txt,col){
    const h=document.createElement('div');h.className='mission-week';
    h.innerHTML=`<span style="display:inline-flex;align-items:center;gap:6px;background:${col};color:#fff;padding:4px 14px;border-radius:99px;font-family:'Fredoka One',cursive;font-size:.85rem;">${txt}</span>`;
    wrap.appendChild(h);
  }

  function mItem(mi,m,locked,cleared,isCurrent,isRev=false,revKey=''){
    const hasRetry=!isRev&&c.retry[mi]&&c.retry[mi].length>0&&!cleared;
    const item=document.createElement('div');
    let cls='mission-item';
    if(cleared)cls+=' cleared';
    else if(locked)cls+=' locked';
    else if(isCurrent)cls+=' current';
    if(isRev)cls+=' '; // reviews use same style
    item.className=cls;

    // icon wrap color
    const iconBg=cleared?'#D1FAE5':isCurrent?'linear-gradient(135deg,#FF6B35,#FFB347)':locked?'#F3F4F6':'linear-gradient(135deg,#E8F4FD,#B8E4F9)';
    const iconShadow=isCurrent?'0 4px 14px rgba(255,107,53,.35)':'0 3px 10px rgba(0,0,0,.07)';

    let badgeHtml='';
    if(cleared)badgeHtml=`<div class="mission-badge cleared">✅</div>`;
    else if(locked)badgeHtml=`<div class="mission-badge locked">🔒</div>`;
    else if(isCurrent)badgeHtml=`<div class="mission-badge current"></div>`;
    else badgeHtml=`<div class="mission-badge locked" style="background:#FFF9C4;">⚠️</div>`;

    const revBadge=isRev?`<span class="rev-badge" style="margin-left:4px;">${revKey==='r1'?'🔁 2주차 리뷰':'🏆 종합 리뷰'}</span>`:'';

    item.innerHTML=`
      <div class="mission-icon-wrap" style="background:${iconBg};box-shadow:${iconShadow};">
        ${cleared?'✅':m.icon}
      </div>
      <div class="mission-info">
        <div class="mission-title">${isRev?'':('M'+(mi+1)+' · ')}${m.name} ${revBadge}</div>
        <div class="mission-desc">${m.desc||''} · +${m.xp}⚡</div>
        ${hasRetry?`<div style="font-size:.7rem;color:#F59E0B;font-weight:800;margin-top:2px;">⚠️ 틀린 문제 있음</div>`:''}
      </div>
      ${badgeHtml}
      <div class="mission-item-shine"></div>`;

    if(!locked){
      item.onclick=()=>{
        if(isRev)startReview(idx,revKey);
        else startMission(idx,mi,hasRetry);
      };
    }
    wrap.appendChild(item);
  }

  // Week 1 (M0-2)
  wkLabel('📅 1주차','#FF6B35');
  [0,1,2].forEach(mi=>{
    const m=l.missions[mi],cl=c.cleared.includes(mi);
    const prev=mi===0||c.cleared.includes(mi-1);
    mItem(mi,m,!cl&&!prev,cl,!cl&&prev);
  });

  // Week 2 (M3-5)
  wkLabel('📅 2주차','#FFB347');
  [3,4,5].forEach(mi=>{
    const m=l.missions[mi],cl=c.cleared.includes(mi);
    const prev=c.cleared.includes(mi-1);
    mItem(mi,m,!cl&&!prev,cl,!cl&&prev);
  });

  // Review 1
  wkLabel('🔁 2주차 리뷰','#AB47BC');
  const r1Avail=c.cleared.includes(5)&&!c.r1;
  mItem(null,{name:'2주차 리뷰',icon:'🔁',desc:'1~2주 학습 복습',xp:40},!r1Avail&&!c.r1,c.r1,r1Avail,true,'r1');

  // Week 3-4 (M6-8)
  wkLabel('📅 3~4주차','#56C568');
  [6,7,8].forEach(mi=>{
    const m=l.missions[mi],cl=c.cleared.includes(mi);
    const prev=c.r1&&(mi===6||c.cleared.includes(mi-1));
    mItem(mi,m,!cl&&!prev,cl,!cl&&prev);
  });

  // Review 2
  wkLabel('🏆 종합 리뷰','#4ECDC4');
  const r2Avail=c.cleared.includes(8)&&!c.r2;
  mItem(null,{name:'4주차 종합 리뷰',icon:'🏆',desc:'이달 전체 복습!',xp:50},!r2Avail&&!c.r2,c.r2,r2Avail,true,'r2');
}

function renderMission(){

/* ── FLIP ── */
function renderFlip(){
  const m=LESSONS[curCity].missions[curMi];
  const cards=[];
  m.pairs.forEach((p,i)=>{
    cards.push({id:'w'+i,pair:i,side:'word',w:p.w,e:p.e});
    cards.push({id:'e'+i,pair:i,side:'emoji',w:p.w,e:p.e});
  });
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  session.flipCards=cards;session.matched=0;session.total=m.pairs.length;
  session.canFlip=true;session.flipped=[];

  document.getElementById('gameBody').innerHTML=`
    <div style="text-align:center;margin-bottom:8px;">
      <span style="font-family:'Fredoka One',cursive;font-size:.9rem;color:var(--muted);">
        🃏 짝을 찾아요! · <span id="flipCount">0</span>/${m.pairs.length} 쌍
      </span>
    </div>
    <div class="flip-grid" id="flipGrid"></div>`;

  const grid=document.getElementById('flipGrid');
  cards.forEach((c,ci)=>{
    const el=document.createElement('div');
    el.className='flip-card';el.id='fc_'+c.id;
    el.innerHTML=`<div class="flip-inner">
      <div class="flip-front"><div class="flip-front-icon">⭐</div></div>
      <div class="flip-back" id="fb_${c.id}">
        ${c.side==='emoji'
          ?`<div class="flip-back-emoji">${c.e}</div><div class="flip-back-word">${c.w}</div>`
          :`<div class="flip-back-word" style="font-size:1rem;font-family:'Fredoka One',cursive;color:var(--text);text-align:center;padding:4px;">${c.w}</div>`}
      </div>
    </div>`;
    el.onclick=()=>flipTap(c.id,c.pair,c.side,c.w,c.e);
    grid.appendChild(el);
  });
}

function flipTap(id,pair,side,w,e){
  if(!session.canFlip)return;
  const el=document.getElementById('fc_'+id);
  if(!el||el.classList.contains('flipped'))return;
  el.classList.add('flipped');
  beep('flip');
  speak(w,0.88);
  session.flipped.push({id,pair,side,w,e});
  if(session.flipped.length===2){
    session.canFlip=false;
    const[a,b]=session.flipped;
    if(a.pair===b.pair&&a.side!==b.side){
      // match!
      setTimeout(()=>{
        beep('match');speak(a.w,0.82);
        document.getElementById('fb_'+a.id).classList.add('matched');
        document.getElementById('fb_'+b.id).classList.add('matched');
        session.matched++;
        const fc=document.getElementById('flipCount');if(fc)fc.textContent=session.matched;
        showFb(true,'짝 맞췄어요! 🎉');rainStars();
        session.flipped=[];session.canFlip=true;
        if(session.matched===session.total)setTimeout(()=>{session.wrong=[];missionDone();},700);
      },400);
    }else{
      setTimeout(()=>{
        beep('wrong');showFb(false);
        [a,b].forEach(x=>{
          const fc=document.getElementById('fc_'+x.id);const fb=document.getElementById('fb_'+x.id);
          if(fb)fb.classList.add('wrong');
          setTimeout(()=>{fc&&fc.classList.remove('flipped');fb&&fb.classList.remove('wrong');},500);
        });
        session.flipped=[];session.canFlip=true;
      },800);
    }
  }
}

/* ── FILL ── */
let fillLocked=false;
function renderFill(){
  const m=LESSONS[curCity].missions[curMi];
  session.qs=[...m.qs];session.qi=0;session.wrong=[];fillLocked=false;
  renderFillQ();
}
function renderFillQ(){
  const q=session.qs[session.qi],tot=session.qs.length;
  updProg();
  const opts=[...q.opts].sort(()=>Math.random()-.5);
  document.getElementById('gameBody').innerHTML=`
    <div style="text-align:center;margin-bottom:8px;">
      <span style="font-family:'Fredoka One',cursive;font-size:.88rem;color:var(--muted);">✏️ ${session.qi+1}/${tot}</span>
    </div>
    <div class="choice-question">
      <div class="choice-img">${q.img}</div>
      <div class="choice-question-txt">${q.sent.replace('___','<span class="choice-blank">???</span>')}</div>
      <div style="margin-top:8px;font-size:.78rem;color:var(--muted);font-weight:700;">${q.ko}</div>
      <button onclick="speakQ()" style="margin-top:8px;background:none;border:2px solid var(--mint);border-radius:99px;padding:5px 14px;font-family:'Fredoka One',cursive;font-size:.82rem;color:var(--mint);cursor:pointer;">🔊 들어봐요</button>
    </div>
    <div class="choice-grid" id="fillOpts"></div>`;
  const og=document.getElementById('fillOpts');
  opts.forEach(o=>{
    const btn=document.createElement('button');btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-btn-word">${o}</span>`;
    btn.onclick=()=>checkFill(btn,o,q.ans,q.sent);
    og.appendChild(btn);
  });
  setTimeout(()=>speak(q.sent.replace('___',q.ans),.8),300);
}
function speakQ(){const q=session.qs[session.qi];speak(q.sent.replace('___',q.ans),.78);}
function checkFill(btn,ans,correct,sent){
  if(fillLocked)return;fillLocked=true;
  if(ans===correct){
    beep('ok');btn.classList.add('correct');showFb(true);
    speak(sent.replace('___',ans),.8);
    setTimeout(()=>{fillLocked=false;session.qi++;updProg();
      if(session.qi>=session.qs.length)missionDone();else renderFillQ();},950);
  }else{
    beep('wrong');btn.classList.add('wrong');showFb(false);
    if(!session.wrong.includes(session.qi))session.wrong.push(session.qi);
    setTimeout(()=>{btn.classList.remove('wrong');fillLocked=false;},700);
  }
}

function renderBuildTiles(){
  const tg=document.getElementById('buildTiles');if(!tg)return;
  tg.innerHTML='';
  session.pool.forEach((w,wi)=>{
    const t=document.createElement('div');t.className='build-tile'+(session.placed.some(p=>p.wi===wi)?' used':'');
    t.id='bt'+wi;t.textContent=w;t.onclick=()=>addBuildTile(wi,w,t);
    tg.appendChild(t);
  });
}
function addBuildTile(wi,w,el){
  if(session.placed.some(p=>p.wi===wi))return;
  session.placed.push({wi,w});
  beep('flip');speak(w,.9);
  const sl=document.getElementById('buildSlots');
  const ph=document.getElementById('buildPh');if(ph)ph.style.display='none';
  const chip=document.createElement('div');chip.className='build-slot-word';chip.textContent=w;
  chip.onclick=()=>removeBuildTile(wi,chip,el);
  sl.appendChild(chip);
  el.classList.add('used');
  const btn=document.getElementById('buildCheckBtn');
  if(btn&&session.placed.length>=session.bAns.length){btn.disabled=false;btn.style.opacity='1';}
}
function removeBuildTile(wi,chip,el){
  session.placed=session.placed.filter(p=>p.wi!==wi);
  chip.remove();
  el.classList.remove('used');
  const btn=document.getElementById('buildCheckBtn');
  if(btn){btn.disabled=true;btn.style.opacity='.4';}
  const sl=document.getElementById('buildSlots');
  if(sl&&!sl.querySelector('.build-slot-word')){
    const ph=document.getElementById('buildPh');if(ph)ph.style.display='';
  }
}
function checkBuild(){
  const placed=session.placed.map(p=>p.w);
  const ok=JSON.stringify(placed)===JSON.stringify(session.bAns);
  const msg=document.getElementById('buildMsg');
  if(ok){
    beep('ok');showFb(true);speak(session.bAns.join(' '),.78);rainStars();
    if(msg)msg.textContent='';
    setTimeout(()=>{session.qi++;updProg();
      if(session.qi>=session.qs.length)missionDone();else{session.placed=[];renderBuildQ();}},1100);
  }else{
    beep('wrong');showFb(false);
    session.bAttempts++;
    if(!session.wrong.includes(session.qi))session.wrong.push(session.qi);
    if(msg){msg.style.color=session.bAttempts>=2?'var(--orange)':'var(--red)';
      msg.textContent=session.bAttempts>=2?`💡 힌트: "${session.bAns[0]}"로 시작해요!`:'❌ 순서가 달라요. 다시 해봐요!';}
    // clear placed
    session.placed=[];
    const sl=document.getElementById('buildSlots');
    if(sl){sl.querySelectorAll('.build-slot-word').forEach(c=>c.remove());
      const ph=document.getElementById('buildPh');if(ph)ph.style.display='';}
    renderBuildTiles();
    const btn=document.getElementById('buildCheckBtn');if(btn){btn.disabled=true;btn.style.opacity='.4';}
    setTimeout(()=>{if(msg)msg.textContent='';},2500);
  }
}

async function fetchVids(city,pts){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:700,
        messages:[{role:'user',content:`Suggest 4 real YouTube videos for kids age 4-7 about "${city}" USA. Educational, English, child-friendly (Blippi, National Geographic Kids, Kids Learning Tube, etc). Return ONLY JSON array no markdown:
[{"title":"...","channel":"...","videoId":"11chars","duration":"3:00","views":"1M"}]`}]})
    });
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'[]').replace(/```json|```/g,'').trim();
    let vids=[];try{vids=JSON.parse(txt);}catch(e){}
    showVids(vids.length?vids:fallback(city));
  }catch(e){showVids(fallback(city));}
}
function fallback(city){return[
  {title:`${city} for Kids`,channel:"Kids Learning Tube",videoId:"WCmq4xNnMHo",duration:"4:00",views:"2M"},
  {title:`Learn About ${city}`,channel:"Nat Geo Kids",videoId:"ScMzIvxBSi4",duration:"5:00",views:"1.2M"},
  {title:`${city} Adventures`,channel:"Blippi",videoId:"9bZkp7q19f0",duration:"6:00",views:"3M"},
  {title:`${city} Songs`,channel:"Super Simple Songs",videoId:"JGwWNGJdvx8",duration:"3:30",views:"5M"}
];}
function showVids(vids){
  const area=document.getElementById('vidArea');if(!area)return;
  area.innerHTML='<div class="video-grid" id="vidGrid"></div><button class="build-check-btn" id="vidDoneBtn" style="opacity:.4;margin-top:14px;" disabled onclick="session.wrong=[];missionDone();">✅ 영상 봤어요!</button>';
  const grid=document.getElementById('vidGrid');
  vids.forEach((v,i)=>{
    const tid=v.videoId&&v.videoId.length===11?v.videoId:null;
    const thumb=tid?`https://img.youtube.com/vi/${tid}/mqdefault.jpg`:'';
    const url=tid?`https://www.youtube.com/watch?v=${tid}`:`https://www.youtube.com/results?search_query=${encodeURIComponent(v.title+' for kids')}`;
    const card=document.createElement('div');card.className='video-thumb';
    card.innerHTML=`${thumb?`<img src="${thumb}" onerror="this.style.display='none'" alt="${v.title}">`:'<div style="width:100%;aspect-ratio:16/9;background:#E8E8E8;display:flex;align-items:center;justify-content:center;font-size:2rem;">🎬</div>'}
      <div class="video-thumb-info"><div class="video-thumb-title">${v.title}</div><div style="font-size:.65rem;color:var(--muted);margin-top:2px;">${v.channel||''} · ${v.views||''}</div></div>`;
    card.onclick=()=>{
      window.open(url,'_blank');
      grid.querySelectorAll('.video-thumb').forEach(c=>c.style.borderColor='');
      card.classList.add('watched');
      setTimeout(()=>{
        const btn=document.getElementById('vidDoneBtn');
        if(btn){btn.disabled=false;btn.style.opacity='1';}
        toast('영상을 봤어요!','🎬');
      },1200);
    };
    grid.appendChild(card);
  });
}

function startReview(cityIdx,rType){
  curCity=cityIdx;curRevType=rType;
  const l=LESSONS[cityIdx];
  session={qs:[],qi:0,wrong:[],placed:[],flipped:[],matched:0,total:0,canFlip:true,spIdx:0,revStep:0};
  setupGameHud(l,{name:rType==='r1'?'2주차 리뷰':'4주차 종합 리뷰',emoji:rType==='r1'?'🔁':'🏆'});
  showScreen('gameScreen');
  renderRevStep();
}
function renderRevStep(){
  const l=LESSONS[curCity],step=session.revStep;
  if(curRevType==='r1'){
    if(step===0){session.qs=[...l.missions[0].qs];session.qi=0;fillLocked=false;renderFillQ();}
    else if(step===1){session.qs=[...l.missions[3].words];session.qi=0;listenLocked=false;renderListenQ();}
    else finishReview();
  }else{
    if(step===0){session.qs=[...l.missions[2].qs];session.qi=0;oxLocked=false;renderOXQ();}
    else if(step===1){session.qs=[...l.missions[4].qs.slice(0,2)];session.qi=0;session.placed=[];renderBuildQ();}
    else finishReview();
  }
}
function revAdvance(){session.revStep++;renderRevStep();}
function finishReview(){
  const xp=curRevType==='r1'?40:50;
  const c=ST.cities[curCity],oldLv=ST.lv;
  if(curRevType==='r1')c.r1=true;else c.r2=true;
  ST.xp+=xp;ST.lv=getLv(ST.xp);save();refreshHUD();
  showResult({emoji:'🔁',title:(curRevType==='r1'?'2주차':'4주차')+'리뷰 완료!',sub:'이달 학습을 잘 복습했어요! 👏',xp,lvUp:ST.lv>oldLv,isReview:true});
}

  if(['fill','ox','listen','build'].includes(m.id)){
    const total=session.qs.length||1;
    document.getElementById('gameProgressFill').style.width=Math.round((session.qi/total)*100)+'%';
  }

  const dotsEl=document.getElementById('gameProgDots');
  if(dotsEl&&['fill','ox','listen','build'].includes(m.id)){
    dotsEl.innerHTML='';
    const tot=session.qs.length;
    for(let i=0;i<Math.min(tot,8);i++){
      const d=document.createElement('div');
      d.className='gpd'+(i<session.qi?' done':i===session.qi?' now':'');
      dotsEl.appendChild(d);
    }
  }
}

/* ── MISSION DONE ── */
function missionDone(){
  if(session.revStep!==undefined&&session.revM===undefined){revAdvance();return;}
  const m=LESSONS[curCity].missions[curMi];
  const c=ST.cities[curCity];
  const wr=session.wrong||[];
  const fullClear=wr.length===0;

  if(fullClear){
    if(!c.cleared.includes(curMi))c.cleared.push(curMi);
    delete c.retry[curMi];
  }else{
    c.retry[curMi]=wr;
  }
  const xpG=fullClear?m.xp:Math.round(m.xp*.4);
  const oldLv=ST.lv;
  ST.xp+=xpG;ST.lv=getLv(ST.xp);save();refreshHUD();

  showResult({
    emoji:fullClear?'🏆':'💪',
    title:fullClear?'클리어! 🎉':'다시 도전해요!',
    sub:fullClear?`${m.name} 완료!\n정말 잘했어요! 👏`:`${wr.length}개 틀렸어요.\n다시 풀면 더 잘할 수 있어요!`,
    xp:xpG,lvUp:ST.lv>oldLv,fullClear,isReview:false
  });
}

function showResult({emoji,title,sub,xp,lvUp,fullClear,isReview}){
  const body=document.getElementById('gameBody');
  if(fullClear)rainStars();

  // Build result screen inline
  const l=LESSONS[curCity],m=l.missions[curMi];
  const nextMi=curMi+1;
  const c=ST.cities[curCity];

  body.innerHTML=`
    <div style="text-align:center;padding:24px 20px 16px;background:linear-gradient(135deg,#FFF9F0,#FFF3E0);border-radius:var(--r-xl);margin-bottom:16px;box-shadow:var(--card-shadow);">
      <div style="font-size:4.5rem;margin-bottom:6px;">${emoji}</div>
      <div style="font-family:'Fredoka One',cursive;font-size:1.6rem;color:var(--text);margin-bottom:6px;">${title}</div>
      <div style="font-size:.88rem;color:var(--muted);font-weight:700;white-space:pre-line;margin-bottom:12px;">${sub}</div>
      <div style="display:inline-block;background:linear-gradient(135deg,var(--sun),var(--peach));border-radius:99px;padding:8px 20px;font-family:'Fredoka One',cursive;font-size:1.05rem;color:#fff;">⚡ +${xp} XP</div>
      ${lvUp?`<div style="margin-top:8px;background:linear-gradient(135deg,var(--lavender),#9B59B6);border-radius:99px;padding:8px 20px;font-family:'Fredoka One',cursive;font-size:1rem;color:#fff;">🎊 Lv.${ST.lv} 달성!</div>`:''}
    </div>
    <div id="resultBtns" style="display:flex;flex-direction:column;gap:10px;"></div>`;

  const btnsEl=document.getElementById('resultBtns');

  if(!isReview&&!fullClear){
    const rb=makeBtn('⚠️ 틀린 문제 다시 풀기','#FF6B35','#fff',()=>startMission(curCity,curMi,true));
    btnsEl.appendChild(rb);
  }
  if(!isReview&&fullClear&&nextMi<l.missions.length){
    const nb=makeBtn(`▶ ${l.missions[nextMi].name} 도전!`,l.color,'#fff',()=>startMission(curCity,nextMi,false));
    btnsEl.appendChild(nb);
  }
  if(!isReview&&fullClear&&curMi===5&&!c.r1){
    const rev=makeBtn('🔁 2주차 리뷰하러 가요!','linear-gradient(135deg,#AB47BC,#7B1FA2)','#fff',()=>startReview(curCity,'r1'));
    btnsEl.appendChild(rev);
  }
  if(!isReview&&fullClear&&curMi===8&&!c.r2){
    const rev=makeBtn('🏆 4주차 종합 리뷰!','linear-gradient(135deg,#1E88E5,#0D47A1)','#fff',()=>startReview(curCity,'r2'));
    btnsEl.appendChild(rev);
  }
  const backBtn=makeBtn('← 미션 목록으로','#F3F4F6','var(--text)',()=>openCity(curCity));
  btnsEl.appendChild(backBtn);

  if(lvUp){
    const lo=document.getElementById('lvupOverlay');
    document.getElementById('lvupSub').textContent=`Lv.${ST.lv} 달성! 대단해요 🎉`;
    lo.classList.add('show');
    setTimeout(()=>lo.classList.remove('show'),3000);
  }
}
function makeBtn(txt,bg,col,fn){
  const b=document.createElement('button');
  b.style.cssText=`padding:14px;border-radius:var(--r-lg);border:none;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;background:${bg};color:${col};box-shadow:0 4px 16px rgba(0,0,0,.1);transition:transform .15s;`;
  b.textContent=txt;b.onclick=fn;
  b.addEventListener('mousedown',()=>b.style.transform='scale(.97)');
  b.addEventListener('mouseup',()=>b.style.transform='');
  return b;
}
function closeLvUp(){document.getElementById('lvupOverlay').classList.remove('show');}

/* ─ FADEUP KEYFRAME ─ */
const ks=document.createElement('style');
ks.textContent='@keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}';
document.head.appendChild(ks);

/* ═══════════ INIT ═══════════ */
LESSONS.forEach((_,i)=>{
  if(!ST.cities[i])ST.cities[i]={cleared:[],retry:{},r1:false,r2:false};
  if(!ST.cities[i].retry)ST.cities[i].retry={};
  if(ST.cities[i].r1===undefined)ST.cities[i].r1=false;
  if(ST.cities[i].r2===undefined)ST.cities[i].r2=false;
});
ST.lv=getLv(ST.xp);save();
renderHome();
</script>
</body>
</html>
